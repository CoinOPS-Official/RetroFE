name: CoinOPS Native Flatpak - Self Hosted

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64

    name: Build Native CoinOPS Flatpak x86_64

    steps:
      # ============================================================
      # Checkout RetroFE
      #
      # clean: false preserves persistent self-hosted build state,
      # especially .flatpak-builder, between workflow runs.
      # ============================================================

      - name: Checkout RetroFE
        uses: actions/checkout@v6
        with:
          clean: false

      # ============================================================
      # Checkout custom MAME fork
      # ============================================================

      - name: Checkout MAME fork
        uses: actions/checkout@v6
        with:
          repository: CoinOPS-Official/MAME-FFMpeg
          ref: mame0285-local
          path: MAME
          token: ${{ secrets.MAME_REPO_TOKEN }}
          clean: true
          fetch-depth: 1

      # ============================================================
      # Show exact source revisions
      # ============================================================

      - name: Show source revisions
        run: |
          echo "============================================================"
          echo "RetroFE revision"
          echo "============================================================"
          git rev-parse HEAD
          echo
          echo "============================================================"
          echo "MAME revision"
          echo "============================================================"
          git -C MAME rev-parse HEAD
      # ============================================================
      # Verify host build tools
      #
      # Install once on self-hosted Arch/CachyOS:
      #
      # sudo pacman -S --needed flatpak flatpak-builder git
      # ============================================================

      - name: Verify host build tools
        run: |
          set -e
          echo "============================================================"
          echo "HOST"
          echo "============================================================"
          uname -a
          echo
          echo "CPU:"
          lscpu | grep -E \
            'Model name|Socket|Core\(s\)|Thread\(s\)|CPU\(s\)' \
            || true
          echo
          echo "Available logical CPUs:"
          nproc
          echo
          echo "Memory:"
          free -h
          echo
          echo "Disk:"
          df -h .
          echo
          echo "============================================================"
          echo "TOOLS"
          echo "============================================================"
          git --version
          flatpak --version
          flatpak-builder --version
      # ============================================================
      # Configure Flathub
      # ============================================================

      - name: Configure Flathub
        run: |
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      # ============================================================
      # Install matching Freedesktop runtime + SDK
      # ============================================================

      - name: Install Freedesktop 25.08 runtime and SDK
        run: |
          flatpak install \
            --user \
            --noninteractive \
            flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08
      # ============================================================
      # Inspect SDK dependency availability
      # ============================================================

      - name: Inspect Freedesktop SDK dependencies
        run: |
          flatpak run \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              echo "============================================================"
              echo "SDL"
              echo "============================================================"
              for pkg in \
                sdl2 \
                SDL2_image \
                SDL2_ttf \
                SDL2_mixer
              do
                printf "%-24s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "NOT FOUND"
                fi
              done
              echo
              echo "============================================================"
              echo "GSTREAMER"
              echo "============================================================"
              for pkg in \
                gstreamer-1.0 \
                gstreamer-app-1.0 \
                gstreamer-video-1.0
              do
                printf "%-24s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "NOT FOUND"
                fi
              done
              echo
              echo "============================================================"
              echo "OTHER DEPENDENCIES"
              echo "============================================================"
              for pkg in \
                fontconfig \
                libcurl \
                libusb-1.0 \
                libevdev \
                libudev \
                zlib \
                libwebp \
                minizip \
                libserialport
              do
                printf "%-24s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "NOT FOUND"
                fi
              done
              echo
              echo "============================================================"
              echo "RETROARCH RENDERING / INPUT"
              echo "============================================================"
              for pkg in \
                vulkan \
                egl \
                gl \
                x11 \
                wayland-client \
                libpulse \
                libudev \
                sdl2
              do
                printf "%-24s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "NOT FOUND"
                fi
              done
              echo
              echo "============================================================"
              echo "CCACHE"
              echo "============================================================"
              if command -v ccache >/dev/null 2>&1; then
                echo "ccache found:"
                command -v ccache
                ccache --version | head -1
              else
                echo "ERROR: ccache not found in Freedesktop SDK"
                exit 1
              fi
            '
      # ============================================================
      # Create launcher + desktop metadata
      # ============================================================

      - name: Create Flatpak metadata
        run: |
          mkdir -p Packaging/Flatpak
          cat > Packaging/Flatpak/coinops-launcher <<'EOF'
          #!/bin/sh
          set -eu
          if [ "$#" -lt 1 ]; then
              echo "Usage:"
              echo "  flatpak run org.coinops.Runtime <CoinOPS build folder>"
              echo
              echo "Example:"
              echo '  flatpak run org.coinops.Runtime "$HOME/CoinOPS Arise"'
              exit 1
          fi
          COINOPS_ROOT="$1"
          shift
          if [ ! -d "$COINOPS_ROOT" ]; then
              echo "CoinOPS build folder not found:"
              echo "  $COINOPS_ROOT"
              exit 1
          fi
          if [ ! -f "$COINOPS_ROOT/settings.conf" ]; then
              echo "settings.conf not found in CoinOPS build folder:"
              echo "  $COINOPS_ROOT"
              exit 1
          fi
          export RETROFE_PATH="$COINOPS_ROOT"
          cd "$COINOPS_ROOT"
          exec /app/bin/retrofe "$@"
          EOF
          chmod +x Packaging/Flatpak/coinops-launcher
          cat > Packaging/Flatpak/coinops-runtime.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CoinOPS Runtime
          Comment=CoinOPS Runtime
          Exec=coinops-launcher
          Icon=org.coinops.Runtime
          Terminal=false
          Categories=Game;
          EOF
          cp \
            Package/Environment/Common/RetroFE.png \
            Packaging/Flatpak/coinops-runtime.png
      # ============================================================
      # Create native Flatpak manifest
      #
      # Module order is deliberate:
      #
      #   SDL2_ttf
      #   MAME
      #   SDL2_image
      #   libevdev
      #   libserialport
      #   minizip
      #   RetroFE
      #   stripped RetroArch runtime
      #   CoinOPS libretro launcher/config contract
      #   runtime-cleanup
      #   launcher metadata
      #
      # SDL2_ttf must precede MAME because MAME requires it.
      #
      # SDL2_image and other RetroFE-only dependencies remain after
      # MAME so changes to them do not invalidate the MAME module.
      #
      # RetroArch is deliberately placed after RetroFE. Updating the
      # pinned RetroArch revision or its build flags therefore does not
      # invalidate either the expensive MAME module or RetroFE.
      # ============================================================

      - name: Create native Flatpak manifest
        run: |
          cat > org.coinops.Runtime.yml <<'EOF'
          app-id: org.coinops.Runtime
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: coinops-launcher
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=wayland
            - --socket=fallback-x11
            - --socket=pulseaudio
            - --device=all
            - --filesystem=/run/udev:ro
            - --filesystem=home
            - --filesystem=/run/media
            - --filesystem=/media
            - --filesystem=/mnt
          modules:
            # ======================================================
            # SDL2_ttf
            #
            # Required by MAME and RetroFE.
            # ======================================================
            - name: SDL2_ttf
              buildsystem: cmake-ninja
              builddir: true
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
                - -DBUILD_SHARED_LIBS=ON
                - -DSDL2TTF_SAMPLES=OFF
              cleanup:
                - /include
                - /lib/cmake
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/libsdl-org/SDL_ttf.git
                  branch: SDL2
            # ======================================================
            # Custom MAME
            #
            # MAME depends on SDL2_ttf, so it comes immediately after
            # SDL2_ttf and before RetroFE-only dependencies.
            #
            # Host:
            #   6 physical cores
            #   12 logical CPUs
            #
            # Use 10 jobs to leave some headroom.
            #
            # Debug info is explicitly disabled because previous full
            # links overflowed 32-bit DWARF relocations.
            # ======================================================
            - name: mame
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
                cflags-override: true
                cxxflags-override: true
                cflags: -O2 -g0
                cxxflags: -O2 -g0
              build-commands:
                - |
                  echo "============================================================"
                  echo "MAME build environment"
                  echo "============================================================"
                  echo "Compiler:"
                  c++ --version
                  echo
                  echo "Available logical CPUs:"
                  nproc
                  echo
                  echo "Configured MAME parallel jobs:"
                  echo "10"
                  echo
                  echo "Environment flags:"
                  echo "CFLAGS=${CFLAGS:-}"
                  echo "CXXFLAGS=${CXXFLAGS:-}"
                  echo "LDFLAGS=${LDFLAGS:-}"
                  echo
                  echo "============================================================"
                  echo "Building custom MAME inside Freedesktop SDK"
                  echo "============================================================"
                  MAME_JOBS=10
                  # SOURCEFILTER can change which translation units belong to each
                  # subtarget library. Remove only the generated CoinOPS archives so
                  # stale library membership cannot survive an incremental build.
                  #
                  # Object files and ccache are preserved, so this is cheap compared
                  # with a clean MAME rebuild.
                  echo "Removing stale CoinOPS static archives..."
                  find build \
                    -type f \
                    -path '*/mame_coinops/*.a' \
                    -print \
                    -delete \
                    2>/dev/null \
                    || true
                  echo
                  echo "Building MAME with ${MAME_JOBS} parallel jobs"
                  set -o pipefail
                  if ! make \
                    -j"${MAME_JOBS}" \
                    SUBTARGET=coinops \
                    SOURCEFILTER=src/mame/coinops.flt \
                    REGENIE=1 \
                    SYMBOLS=0 \
                    SYMLEVEL=0 \
                    ARCHOPTS="-g0" \
                    USE_FFMPEG=0 \
                    TOOLS=0 \
                    TESTS=0 \
                    BENCHMARKS=0 \
                    USE_QTDEBUG=0 \
                    NO_USE_MIDI=1 \
                    NO_USE_PORTAUDIO=1 \
                    USE_TAPTUN=0 \
                    USE_PCAP=0 \
                    2>&1 \
                    | tee mame-build.log \
                    | awk '
                        /Compiling/ || /Archiving/ || /Compressing/ || /Generating/ {
                          progress++
                          if (progress == 1 || progress % 100 == 0) {
                            printf "[MAME] %d build steps completed... %s\\n", progress, $0
                            fflush()
                          }
                          next
                        }
                        {
                          print
                          fflush()
                        }
                      '
                  then
                    echo
                    echo "============================================================"
                    echo "MAME BUILD FAILED - LAST 200 LOG LINES"
                    echo "============================================================"
                    tail -200 mame-build.log || true
                    exit 1
                  fi
                  test -x coinops
                  echo
                  echo "============================================================"
                  echo "Built CoinOPS MAME subtarget"
                  echo "============================================================"
                  ./coinops -version
                  ls -lh coinops
                  du -h coinops
                  # Install under the standard runtime name expected by RetroFE.
                  install -Dm755 coinops /app/bin/mame
              sources:
                - type: git
                  path: MAME
                  branch: mame0285-local
            # ======================================================
            # SDL2_image
            #
            # Load:
            #   PNG
            #   JPG/JPEG
            #   QOI
            #   WebP
            #   GIF
            #
            # Save:
            #   PNG only
            #
            # PNG_SAVE is required by RetroFE IMG_SavePNG() for
            # generated QR codes.
            # ======================================================
            - name: SDL2_image
              buildsystem: cmake-ninja
              builddir: true
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
                - -DBUILD_SHARED_LIBS=ON
                - -DSDL2IMAGE_SAMPLES=OFF
                - -DSDL2IMAGE_TESTS=OFF
                # Formats RetroFE uses.
                - -DSDL2IMAGE_PNG=ON
                - -DSDL2IMAGE_JPG=ON
                - -DSDL2IMAGE_QOI=ON
                - -DSDL2IMAGE_WEBP=ON
                - -DSDL2IMAGE_GIF=ON
                # PNG writing required for generated QR codes.
                - -DSDL2IMAGE_PNG_SAVE=ON
                # JPEG writing not required.
                - -DSDL2IMAGE_JPG_SAVE=OFF
                # Disable unused formats.
                - -DSDL2IMAGE_AVIF=OFF
                - -DSDL2IMAGE_BMP=OFF
                - -DSDL2IMAGE_JXL=OFF
                - -DSDL2IMAGE_LBM=OFF
                - -DSDL2IMAGE_PCX=OFF
                - -DSDL2IMAGE_PNM=OFF
                - -DSDL2IMAGE_SVG=OFF
                - -DSDL2IMAGE_TGA=OFF
                - -DSDL2IMAGE_TIF=OFF
                - -DSDL2IMAGE_XCF=OFF
                - -DSDL2IMAGE_XPM=OFF
                - -DSDL2IMAGE_XV=OFF
              cleanup:
                - /include
                - /lib/cmake
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/libsdl-org/SDL_image.git
                  branch: SDL2
            # ======================================================
            # libevdev
            # ======================================================
            - name: libevdev
              buildsystem: meson
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -Dtests=disabled
                - -Ddocumentation=disabled
              cleanup:
                - /bin/libevdev-tweak-device
                - /bin/mouse-dpi-tool
                - /bin/touchpad-edge-detector
                - /include
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://gitlab.freedesktop.org/libevdev/libevdev.git
                  branch: master
            # ======================================================
            # libserialport
            # ======================================================
            - name: libserialport
              buildsystem: autotools
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - --disable-static
                - --enable-shared
              cleanup:
                - /include
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/martinling/libserialport.git
                  branch: master
            # ======================================================
            # Classic Minizip
            #
            # Required by ThirdParty/openhi2txt.
            #
            # Headers are temporarily installed into /app/include so
            # RetroFE can compile against them.
            #
            # The final runtime-cleanup module removes the headers
            # after RetroFE has finished building.
            # ======================================================
            - name: minizip
              buildsystem: simple
              subdir: contrib/minizip
              build-options:
                strip: true
                no-debuginfo: true
              build-commands:
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c ioapi.c \
                    -o ioapi.o
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c unzip.c \
                    -o unzip.o
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c zip.c \
                    -o zip.o
                - |
                  cc \
                    -shared \
                    -Wl,-soname,libminizip.so.1 \
                    -o libminizip.so.1.0.0 \
                    ioapi.o \
                    unzip.o \
                    zip.o \
                    -lz
                - ln -sf libminizip.so.1.0.0 libminizip.so.1
                - ln -sf libminizip.so.1 libminizip.so
                - install -Dm755 libminizip.so.1.0.0 /app/lib/libminizip.so.1.0.0
                - ln -sf libminizip.so.1.0.0 /app/lib/libminizip.so.1
                - ln -sf libminizip.so.1 /app/lib/libminizip.so
                - install -Dm644 unzip.h /app/include/minizip/unzip.h
                - install -Dm644 zip.h /app/include/minizip/zip.h
                - install -Dm644 ioapi.h /app/include/minizip/ioapi.h
              sources:
                - type: git
                  url: https://github.com/madler/zlib.git
                  tag: v1.3.1
            # ======================================================
            # RetroFE
            #
            # Flatpak-builder copies the CONTENTS of the RetroFE
            # directory into the module build root.
            # ======================================================
            - name: retrofe
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
              build-commands:
                - |
                  echo "============================================================"
                  echo "Checking required RetroFE dependencies"
                  echo "============================================================"
                  check_pkg() {
                    PKG="$1"
                    if pkg-config --exists "$PKG"; then
                      VERSION="$(pkg-config --modversion "$PKG")"
                      echo "[FOUND] $PKG $VERSION"
                    else
                      echo "[MISSING] $PKG"
                      exit 1
                    fi
                  }
                  echo
                  echo "--- SDL ---"
                  check_pkg sdl2
                  check_pkg SDL2_image
                  check_pkg SDL2_ttf
                  check_pkg SDL2_mixer
                  echo
                  echo "--- GStreamer ---"
                  check_pkg gstreamer-1.0
                  check_pkg gstreamer-app-1.0
                  check_pkg gstreamer-video-1.0
                  echo
                  echo "--- Other dependencies ---"
                  check_pkg fontconfig
                  check_pkg libcurl
                  check_pkg libusb-1.0
                  check_pkg libevdev
                  check_pkg libudev
                  check_pkg zlib
                  check_pkg libwebp
                  check_pkg libserialport
                  echo
                  echo "--- Minizip ---"
                  if [ -f /app/include/minizip/unzip.h ] && \
                     [ -f /app/lib/libminizip.so ]; then
                    echo "[FOUND] classic minizip"
                  else
                    echo "[MISSING] classic minizip"
                    exit 1
                  fi
                - |
                  echo
                  echo "============================================================"
                  echo "Configuring RetroFE"
                  echo "============================================================"
                  cmake \
                    -S Source \
                    -B Build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH=/app \
                    -DCMAKE_INSTALL_PREFIX=/app \
                    -DMINIZIP_INCLUDE_DIR=/app/include/minizip \
                    -DMINIZIP_LIBRARY=/app/lib/libminizip.so
                - |
                  echo
                  echo "============================================================"
                  echo "Building RetroFE"
                  echo "============================================================"
                  cmake \
                    --build Build \
                    --parallel 10
                - test -x Build/retrofe
                - install -Dm755 Build/retrofe /app/bin/retrofe
              sources:
                - type: dir
                  path: RetroFE
                  skip:
                    - .git
                    - .github
            # ======================================================
            # Stripped RetroArch libretro runtime
            #
            # Purpose:
            #   Command-line-only libretro host for systems MAME does
            #   not handle well enough. No RetroArch menu/UI assets,
            #   databases, updater, achievements, or media player.
            #
            # Kept deliberately:
            #   - dynamic external core loading
            #   - config/core options/save/state/disk/VFS support
            #   - SDL2 + udev input and rumble
            #   - OpenGL/OpenGL Core + Vulkan hardware contexts
            #   - Wayland + X11/EGL/GLX presentation
            #   - overlays/bezels
            #   - GLSL + Slang shaders with bundled glslang
            #   - microphone API support (needed by some DS titles)
            #
            # Cores, shaders, overlays, configs, BIOS/system files,
            # saves and states are intentionally NOT installed here.
            # They live in the mutable CoinOPS data tree and are passed
            # to this executable by path.
            #
            # Pin to RetroArch v1.22.2 release commit for reproducible
            # builds. This is an unmodified GPLv3 upstream binary, only
            # configured with a reduced feature set and renamed on install.
            # ======================================================
            - name: retroarch-runtime
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
                cflags-override: true
                cxxflags-override: true
                cflags: -O2 -g0
                cxxflags: -O2 -g0
              build-commands:
                # RetroArch v1.22.2 no-menu regression: these netplay state
                # variables are declared only in the HAVE_MENU branch but are
                # used unconditionally later in runloop_iterate(). Patch the
                # pinned source minimally before configuration.
                - |
                  python3 -c 'from pathlib import Path; p=Path("runloop.c"); s=p.read_text(); old="#else\n   bool core_paused                       = (runloop_st->flags & RUNLOOP_FLAG_PAUSED) ? true : false;\n#endif\n"; new="#else\n#ifdef HAVE_NETWORKING\n   bool netplay_allow_timeskip            = netplay_driver_ctl(RARCH_NETPLAY_CTL_ALLOW_TIMESKIP, NULL);\n   bool netplay_allow_pause               = netplay_driver_ctl(RARCH_NETPLAY_CTL_ALLOW_PAUSE, NULL);\n#else\n   bool netplay_allow_timeskip            = false;\n   bool netplay_allow_pause               = false;\n#endif\n   bool core_paused                       = (runloop_st->flags & RUNLOOP_FLAG_PAUSED) ? true : false;\n#endif\n"; assert old in s, "Expected RetroArch v1.22.2 no-menu runloop block not found"; p.write_text(s.replace(old,new,1)); print("Applied CoinOPS RetroArch no-menu runloop fix")'
                # RetroArch v1.22.2 no-menu regression: runtime_file.c uses
                # runloop_state_t/runloop_state_get_ptr(), but only receives
                # runloop.h transitively through menu headers in normal builds.
                # Include the dependency directly for a no-menu build.
                - |
                  python3 -c 'from pathlib import Path; p=Path("runtime_file.c"); s=p.read_text(); old="#include \"msg_hash.h\"\n"; new="#include \"msg_hash.h\"\n#include \"runloop.h\"\n"; assert old in s, "Expected RetroArch v1.22.2 runtime_file include block not found"; p.write_text(s.replace(old,new,1)); print("Applied CoinOPS RetroArch runtime_file no-menu include fix")'
                - |
                  echo "============================================================"
                  echo "Configuring stripped RetroArch runtime"
                  echo "============================================================"
                  ./configure \
                    --prefix=/app \
                    --disable-menu \
                    --enable-gfx_widgets \
                    --disable-rgui \
                    --disable-materialui \
                    --disable-xmb \
                    --disable-ozone \
                    --disable-qt \
                    --disable-libretrodb \
                    --disable-core_info_cache \
                    --disable-online_updater \
                    --disable-update_cores \
                    --disable-update_core_info \
                    --disable-update_assets \
                    --disable-imageviewer \
                    --disable-video_filter \
                    --disable-dsp_filter \
                    --disable-ffmpeg \
                    --disable-mpv \
                    --disable-ssa \
                    --disable-networkgamepad \
                    --disable-netplaydiscovery \
                    --disable-discord \
                    --disable-cheevos \
                    --disable-cheevos_rvz \
                    --disable-accessibility \
                    --disable-translate \
                    --disable-runahead \
                    --disable-rewind \
                    --disable-bsv_movie \
                    --disable-audiomixer \
                    --disable-videoprocessor \
                    --disable-langextra \
                    --enable-shaderpipeline \
                    --disable-opengl1 \
                    --disable-vulkan_display \
                    --disable-vg \
                    --disable-cg \
                    --disable-kms \
                    --disable-cdrom \
                    --disable-crtswitchres \
                    --disable-test_drivers \
                    --enable-overlay \
                    --enable-dynamic \
                    --enable-sdl2 \
                    --enable-udev \
                    --enable-threads \
                    --enable-opengl \
                    --enable-opengl_core \
                    --enable-vulkan \
                    --enable-wayland \
                    --enable-x11 \
                    --enable-egl \
                    --enable-glx \
                    --enable-pulse \
                    --disable-pipewire \
                    --enable-glsl \
                    --enable-slang \
                    --enable-glslang \
                    --enable-builtinglslang \
                    --enable-spirv_cross \
                    --enable-microphone
                - |
                  echo
                  echo "============================================================"
                  echo "Building stripped RetroArch runtime"
                  echo "============================================================"
                  make -j10
                - test -x retroarch
                - install -Dm755 retroarch /app/bin/coinops-retroarch
                - install -Dm644 COPYING /app/share/licenses/coinops-retroarch/COPYING
                - |
                  echo
                  echo "============================================================"
                  echo "RetroArch compiled feature report"
                  echo "============================================================"
                  /app/bin/coinops-retroarch --features || true
              sources:
                - type: git
                  url: https://github.com/libretro/RetroArch.git
                  commit: 69a4f0ea1e8aaf442ae4858f2e7f2b31a1776576
            # ======================================================
            # CoinOPS libretro launcher/config contract
            #
            # Kept in a tiny module after RetroArch so launcher/config
            # changes never invalidate the expensive RetroArch build.
            # ======================================================
            - name: coinops-libretro-launcher
              buildsystem: simple
              build-commands:
                - |
                  install -d /app/bin /app/share/coinops/libretro
                  cat > /app/bin/coinops-libretro <<'COINOPS_LIBRETRO_SCRIPT'
                  #!/usr/bin/env bash
                  set -euo pipefail
                  
                  usage() {
                      echo "Usage: coinops-libretro <core-name> <content> [additional content arguments...]" >&2
                      exit 2
                  }
                  
                  [[ $# -ge 2 ]] || usage
                  
                  CORE_NAME="$1"
                  shift
                  
                  # Core names are directory names below emulators/libretro/cores. Reject path
                  # separators/traversal so callers cannot escape the managed core root.
                  if [[ ! "$CORE_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || [[ "$CORE_NAME" == "." ]] || [[ "$CORE_NAME" == ".." ]]; then
                      echo "coinops-libretro: invalid core name: $CORE_NAME" >&2
                      exit 2
                  fi
                  
                  # Production launches inherit RETROFE_PATH from coinops-launcher. COINOPS_ROOT
                  # is accepted as an explicit diagnostic/manual-launch fallback.
                  COINOPS_ROOT="${RETROFE_PATH:-${COINOPS_ROOT:-}}"
                  if [[ -z "$COINOPS_ROOT" ]]; then
                      echo "coinops-libretro: RETROFE_PATH is not set" >&2
                      echo "Set RETROFE_PATH (or COINOPS_ROOT for manual testing) to the CoinOPS data root." >&2
                      exit 1
                  fi
                  
                  # Normalize the root without requiring that every child already exists.
                  if ! COINOPS_ROOT="$(cd "$COINOPS_ROOT" 2>/dev/null && pwd -P)"; then
                      echo "coinops-libretro: CoinOPS root does not exist: ${RETROFE_PATH:-${COINOPS_ROOT:-}}" >&2
                      exit 1
                  fi
                  
                  LIBRETRO_ROOT="$COINOPS_ROOT/emulators/libretro"
                  CORE_ROOT="$LIBRETRO_ROOT/cores/$CORE_NAME"
                  GLOBAL_CFG="$LIBRETRO_ROOT/retroarch.cfg"
                  CORE_CFG="$CORE_ROOT/core.cfg"
                  CORE_OPTIONS="$CORE_ROOT/core-options.cfg"
                  RUNTIME_CFG="$CORE_ROOT/.coinops-runtime.cfg"
                  
                  if [[ ! -d "$CORE_ROOT" ]]; then
                      echo "coinops-libretro: core package not found: $CORE_ROOT" >&2
                      exit 1
                  fi
                  
                  # If the movable data tree does not yet contain the shared config, seed it from
                  # the immutable runtime template. Existing user/project config is never replaced.
                  if [[ ! -f "$GLOBAL_CFG" ]]; then
                      TEMPLATE_CFG="/app/share/coinops/libretro/retroarch.cfg"
                      if [[ ! -f "$TEMPLATE_CFG" ]]; then
                          echo "coinops-libretro: shared RetroArch config missing: $GLOBAL_CFG" >&2
                          exit 1
                      fi
                      mkdir -p "$LIBRETRO_ROOT"
                      cp "$TEMPLATE_CFG" "$GLOBAL_CFG"
                  fi
                  
                  [[ -f "$CORE_CFG" ]] || {
                      echo "coinops-libretro: required core config missing: $CORE_CFG" >&2
                      exit 1
                  }
                  
                  [[ -f "$CORE_OPTIONS" ]] || {
                      echo "coinops-libretro: required core options missing: $CORE_OPTIONS" >&2
                      exit 1
                  }
                  
                  # These paths are owned by the generic launcher. A core package must not hardcode
                  # them in core.cfg because doing so would break portability/containment.
                  if grep -Eq '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' "$CORE_CFG"; then
                      echo "coinops-libretro: core.cfg contains launcher-managed path settings:" >&2
                      grep -En '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' "$CORE_CFG" >&2 || true
                      exit 1
                  fi
                  
                  mapfile -t CORE_LIBS < <(
                      find "$CORE_ROOT" -maxdepth 1 -type f -name '*_libretro.so' -print | sort
                  )
                  
                  if [[ ${#CORE_LIBS[@]} -ne 1 ]]; then
                      echo "coinops-libretro: expected exactly one *_libretro.so in $CORE_ROOT; found ${#CORE_LIBS[@]}" >&2
                      printf '  %s\n' "${CORE_LIBS[@]:-}" >&2
                      exit 1
                  fi
                  
                  CORE_LIBRARY="${CORE_LIBS[0]}"
                  
                  # Required mutable per-core locations. mkdir -p is intentional: empty
                  # directories are not always preserved by archive formats.
                  mkdir -p \
                      "$CORE_ROOT/system" \
                      "$CORE_ROOT/saves" \
                      "$CORE_ROOT/states" \
                      "$CORE_ROOT/remaps" \
                      "$LIBRETRO_ROOT/autoconfig" \
                      "$LIBRETRO_ROOT/shaders" \
                      "$LIBRETRO_ROOT/overlays"
                  
                  # Create one deterministic generated append-config. It is rewritten atomically on
                  # every launch, so moving the entire CoinOPS tree requires no config editing.
                  RUNTIME_TMP="${RUNTIME_CFG}.tmp.$$"
                  trap 'rm -f "$RUNTIME_TMP"' EXIT
                  
                  {
                      cat "$CORE_CFG"
                      cat <<CFG
                  
                  # ------------------------------------------------------------------
                  # Generated by coinops-libretro. Do not edit; rewritten every launch.
                  # ------------------------------------------------------------------
                  system_directory = "$CORE_ROOT/system"
                  savefile_directory = "$CORE_ROOT/saves"
                  savestate_directory = "$CORE_ROOT/states"
                  core_options_path = "$CORE_OPTIONS"
                  input_remapping_directory = "$CORE_ROOT/remaps"
                  joypad_autoconfig_dir = "$LIBRETRO_ROOT/autoconfig"
                  video_shader_dir = "$LIBRETRO_ROOT/shaders"
                  overlay_directory = "$LIBRETRO_ROOT/overlays"
                  CFG
                  } > "$RUNTIME_TMP"
                  
                  mv -f "$RUNTIME_TMP" "$RUNTIME_CFG"
                  trap - EXIT
                  
                  # Do not change working directory: RetroFE may pass relative content paths that
                  # are relative to the movable CoinOPS root. Every managed RetroArch/core path
                  # above is absolute, so no cwd trickery is required.
                  exec /app/bin/coinops-retroarch \
                      --config "$GLOBAL_CFG" \
                      --appendconfig "$RUNTIME_CFG" \
                      -L "$CORE_LIBRARY" \
                      "$@"
                  COINOPS_LIBRETRO_SCRIPT
                  chmod 0755 /app/bin/coinops-libretro
                - |
                  cat > /app/share/coinops/libretro/retroarch.cfg <<'COINOPS_RETROARCH_CFG'
                  # CoinOPS shared RetroArch configuration
                  #
                  # This file contains settings shared by every CoinOPS libretro core.
                  # Core-specific RetroArch overrides belong in:
                  #   emulators/libretro/cores/<core-name>/core.cfg
                  #
                  # Per-core directories (system, saves, states, remaps and core options)
                  # are injected by /app/bin/coinops-libretro at launch time so the entire
                  # CoinOPS data tree remains movable.
                  
                  # Never rewrite this curated configuration on exit.
                  config_save_on_exit = false
                  
                  # CoinOPS launches content directly; RetroArch is an invisible host.
                  video_fullscreen = true
                  video_windowed_fullscreen = true
                  
                  # The Flatpak exposes PulseAudio. On PipeWire systems this is serviced by
                  # the PulseAudio compatibility layer.
                  audio_driver = "pulse"
                  
                  # CoinOPS owns application lifecycle and should continue running content
                  # if desktop focus changes transiently.
                  pause_nonactive = false
                  
                  # Do not create implicit automatic savestates behind the frontend's back.
                  savestate_auto_save = false
                  savestate_auto_load = false
                  
                  # Menu/history/runtime bookkeeping is unnecessary for direct CoinOPS launches.
                  history_list_enable = false
                  content_runtime_log = false
                  COINOPS_RETROARCH_CFG
                - |
                  cat > /app/share/coinops/libretro/PACKAGE-CONTRACT.txt <<'COINOPS_LIBRETRO_CONTRACT'
                  CoinOPS libretro core package contract
                  ======================================
                  
                  Shared RetroArch host layer:
                  
                    emulators/libretro/
                      retroarch.cfg
                      autoconfig/
                      shaders/
                      overlays/
                      cores/
                  
                  Every core is a self-contained package below:
                  
                    emulators/libretro/cores/<core-name>/
                      <core>_libretro.so      exactly one *_libretro.so
                      core.cfg                RetroArch overrides for this core
                      core-options.cfg        libretro core options/defaults
                      manifest.json           package/source metadata
                      LICENSE.txt             core license
                      system/                 BIOS/firmware/core writable system data
                      saves/                  save RAM / memory-card-style frontend saves
                      states/                 RetroArch save states
                      remaps/                 RetroArch input remaps for this core
                  
                  Launcher-managed keys MUST NOT appear in core.cfg:
                  
                    system_directory
                    savefile_directory
                    savestate_directory
                    core_options_path
                    input_remapping_directory
                  
                  /app/bin/coinops-libretro injects those paths using an absolute generated
                  .coinops-runtime.cfg on every launch. This guarantees that moving the entire
                  CoinOPS data root never requires rewriting stored configuration.
                  
                  Shared resource directories are also injected by the launcher:
                  
                    joypad_autoconfig_dir -> emulators/libretro/autoconfig
                    video_shader_dir      -> emulators/libretro/shaders
                    overlay_directory     -> emulators/libretro/overlays
                  
                  Launch interface:
                  
                    coinops-libretro <core-name> <content> [additional content arguments...]
                  
                  Example:
                  
                    coinops-libretro flycast "/roms/Crazy Taxi (USA).chd"
                  
                  Future core packages should be rejected by CI unless they satisfy this layout
                  and pass validate-libretro-core.sh (exports + runtime dependency checks).
                  COINOPS_LIBRETRO_CONTRACT

            # ======================================================
            # Final runtime cleanup
            #
            # At this point MAME, RetroFE and RetroArch are fully built.
            #
            # Remove development/debug/build-only files that are not
            # required by the installed runtime.
            # ======================================================
            - name: runtime-cleanup
              buildsystem: simple
              build-commands:
                - |
                  echo "============================================================"
                  echo "Cleaning final runtime payload"
                  echo "============================================================"
                # Development headers.
                - rm -rf /app/include
                # Debug symbols and copied source trees.
                - rm -rf /app/lib/debug
                # Build-system metadata.
                - rm -rf /app/lib/cmake
                - rm -rf /app/lib/pkgconfig
                # Documentation/man pages from helper utilities.
                - rm -rf /app/share/man
                # Static and libtool archives.
                - |
                  find /app \
                    -type f \
                    \( -name '*.a' -o -name '*.la' \) \
                    -delete
                # Remove unversioned linker-only .so symlinks.
                #
                # Keep runtime SONAME links such as:
                #
                #   libfoo.so.0
                #   libfoo.so.1
                #
                # Executables load those at runtime.
                - |
                  find /app/lib \
                    -maxdepth 1 \
                    -type l \
                    -name '*.so' \
                    -delete
                - |
                  echo
                  echo "============================================================"
                  echo "Remaining /app/lib contents"
                  echo "============================================================"
                  find /app/lib \
                    -maxdepth 2 \
                    \( -type f -o -type l \) \
                    -print \
                    | sort \
                    || true
            # ======================================================
            # CoinOPS launcher + desktop metadata
            # ======================================================
            - name: coinops-runtime
              buildsystem: simple
              build-commands:
                - install -Dm755 coinops-launcher /app/bin/coinops-launcher
                - install -Dm644 coinops-runtime.desktop /app/share/applications/org.coinops.Runtime.desktop
                - install -Dm644 coinops-runtime.png /app/share/icons/hicolor/256x256/apps/org.coinops.Runtime.png
              sources:
                - type: file
                  path: Packaging/Flatpak/coinops-launcher
                - type: file
                  path: Packaging/Flatpak/coinops-runtime.desktop
                - type: file
                  path: Packaging/Flatpak/coinops-runtime.png
          EOF
      # ============================================================
      # Inspect persistent local builder state
      #
      # No actions/cache step is needed on the normal self-hosted
      # runner because .flatpak-builder remains on local storage.
      # ============================================================

      - name: Inspect persistent build cache
        run: |
          echo "============================================================"
          echo "PERSISTENT FLATPAK-BUILDER STATE"
          echo "============================================================"
          if [ -d .flatpak-builder ]; then
            du -sh .flatpak-builder || true
            echo
            echo "Top-level cache contents:"
            du \
              -h \
              --max-depth=1 \
              .flatpak-builder \
              2>/dev/null \
              | sort -h \
              || true
          else
            echo "No existing .flatpak-builder cache."
            echo "This appears to be the first local build."
          fi
      # ============================================================
      # Build native Flatpak
      #
      # build-dir and repo are disposable.
      #
      # .flatpak-builder is deliberately preserved.
      # ============================================================

      - name: Build native CoinOPS Flatpak
        run: |
          rm -rf build-dir repo
          echo "============================================================"
          echo "Starting native Flatpak build"
          echo "============================================================"
          flatpak-builder \
            --user \
            --force-clean \
            --ccache \
            --keep-build-dirs \
            --repo=repo \
            --install-deps-from=flathub \
            build-dir \
            org.coinops.Runtime.yml
      # ============================================================
      # Analyze resulting Flatpak
      # ============================================================

      - name: Analyze native Flatpak
        run: |
          echo "============================================================"
          echo "TOTAL /APP PAYLOAD"
          echo "============================================================"
          du -sh build-dir/files
          echo
          echo "============================================================"
          echo "/APP/BIN"
          echo "============================================================"
          ls -lh build-dir/files/bin
          echo
          echo "============================================================"
          echo "RETROFE"
          echo "============================================================"
          file build-dir/files/bin/retrofe
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/retrofe || true
          echo
          echo "============================================================"
          echo "MAME"
          echo "============================================================"
          file build-dir/files/bin/mame
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/mame || true
          echo
          echo "============================================================"
          echo "COINOPS RETROARCH RUNTIME"
          echo "============================================================"
          file build-dir/files/bin/coinops-retroarch
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/coinops-retroarch || true
          echo
          echo "============================================================"
          echo "BUNDLED /APP/LIB"
          echo "============================================================"
          if [ -d build-dir/files/lib ]; then
            find build-dir/files/lib \
              -maxdepth 3 \
              \( -type f -o -type l \) \
              -printf '%p\n' \
              | sort
            echo
            du \
              -h \
              -d 3 \
              build-dir/files/lib \
              2>/dev/null \
              | sort -h \
              | tail -100
          fi
          echo
          echo "============================================================"
          echo "BUILD-ONLY FILE CHECK"
          echo "============================================================"
          for path in \
            build-dir/files/include \
            build-dir/files/lib/debug \
            build-dir/files/lib/cmake \
            build-dir/files/lib/pkgconfig \
            build-dir/files/share/man
          do
            if [ -e "$path" ]; then
              echo "[LEFTOVER] $path"
            else
              echo "[CLEAN] $path"
            fi
          done
          echo
          echo "============================================================"
          echo "50 LARGEST FILES IN /APP"
          echo "============================================================"
          find build-dir/files \
            -type f \
            -printf '%s %p\n' \
            | sort -nr \
            | head -50 \
            | numfmt \
                --field=1 \
                --to=iec \
            || true
          echo
          echo "============================================================"
          echo "REPOSITORY SIZE"
          echo "============================================================"
          du -sh repo
          echo
          echo "============================================================"
          echo "PERSISTENT BUILDER CACHE SIZE"
          echo "============================================================"
          du -sh .flatpak-builder || true
      # ============================================================
      # Smoke tests
      # ============================================================

      - name: Smoke test native Flatpak
        run: |
          echo "============================================================"
          echo "RetroFE version"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/retrofe \
            --version \
            || true
          echo
          echo "============================================================"
          echo "MAME version"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/mame \
            -version
          echo
          echo "============================================================"
          echo "Stripped RetroArch version + features"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/coinops-retroarch \
            --version
          echo
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/coinops-retroarch \
            --features
          echo
          echo "============================================================"
          echo "PATH resolution"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            sh \
            -c '
              echo "$PATH"
              echo
              echo "retrofe:"
              command -v retrofe
              echo
              echo "mame:"
              command -v mame
              echo
              echo "coinops-retroarch:"
              command -v coinops-retroarch
              echo "coinops-libretro:"
              command -v coinops-libretro
              test -f /app/share/coinops/libretro/retroarch.cfg
              echo
              echo "coinops-launcher:"
              command -v coinops-launcher
            '
      # ============================================================
      # Build Flycast libretro core as a MUTABLE external package
      #
      # The core is intentionally NOT installed under /app.
      # It is built with the same Freedesktop 25.08 SDK, validated
      # by dlopen() inside the assembled CoinOPS Flatpak sandbox,
      # then uploaded as a separate mutable artifact.
      # ============================================================

      - name: Checkout CoinOPS Flycast core source
        uses: actions/checkout@v6
        with:
          repository: CoinOPS-Official/flycast
          ref: e7426bb864157a4c45866d6253bd24ae89f7d046
          path: FlycastCore
          clean: true
          fetch-depth: 1
          submodules: recursive

      - name: Show Flycast core revision
        run: |
          echo "============================================================"
          echo "Flycast libretro source revision"
          echo "============================================================"
          git -C FlycastCore rev-parse HEAD
          git -C FlycastCore describe --tags --always || true

      - name: Build Flycast libretro core in Freedesktop 25.08 SDK
        run: |
          set -euo pipefail

          rm -rf FlycastCore/build-libretro

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              cd "$GITHUB_WORKSPACE/FlycastCore"

              echo "============================================================"
              echo "Configuring Flycast libretro core"
              echo "============================================================"

              cmake \
                -S . \
                -B build-libretro \
                -DCMAKE_BUILD_TYPE=Release \
                -DLIBRETRO=ON \
                -DUSE_VULKAN=ON \
                -DUSE_OPENGL=ON \
                -DUSE_OPENMP=ON \
                -DUSE_HOST_GLSLANG=OFF \
                -DUSE_HOST_LIBZIP=OFF \
                -DUSE_HOST_LIBCHDR=OFF \
                -DUSE_BREAKPAD=OFF \
                -DUSE_LUA=OFF \
                -DUSE_LIBCDIO=OFF \
                -DENABLE_CTEST=OFF

              echo
              echo "============================================================"
              echo "Building Flycast libretro core"
              echo "============================================================"

              cmake --build build-libretro --parallel 10

              test -f build-libretro/flycast_libretro.so
              strip --strip-unneeded build-libretro/flycast_libretro.so

              echo
              echo "============================================================"
              echo "Flycast core ELF dependencies (SDK view)"
              echo "============================================================"
              ldd build-libretro/flycast_libretro.so || true

              echo
              echo "============================================================"
              echo "Flycast libretro exports"
              echo "============================================================"

              for symbol in \
                retro_api_version \
                retro_init \
                retro_deinit \
                retro_load_game \
                retro_unload_game \
                retro_run
              do
                if ! nm -D build-libretro/flycast_libretro.so \
                  | grep -Eq "[[:space:]]${symbol}$"; then
                  echo "ERROR: missing required libretro export: $symbol"
                  exit 1
                fi
                echo "found: $symbol"
              done

            '

          # Create the tiny dlopen validator in the OUTER GitHub shell.
          # Keeping this heredoc out of the nested `sh -c '...'` avoids
          # heredoc-delimiter/quoting problems.
          cat > FlycastCore/build-libretro/coinops_core_dlopen_test.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>

          typedef unsigned (*retro_api_version_fn)(void);

          int main(int argc, char **argv)
          {
              void *handle;
              retro_api_version_fn api_version;
              const char *error;

              if (argc != 2)
              {
                  fprintf(stderr, "usage: %s <libretro-core.so>\n", argv[0]);
                  return 2;
              }

              dlerror();
              handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle)
              {
                  fprintf(stderr, "dlopen failed: %s\n", dlerror());
                  return 1;
              }

              dlerror();
              *(void **)(&api_version) = dlsym(handle, "retro_api_version");
              error = dlerror();

              if (error != NULL || api_version == NULL)
              {
                  fprintf(stderr, "dlsym failed: %s\n",
                          error ? error : "retro_api_version missing");
                  dlclose(handle);
                  return 1;
              }

              printf("Flycast core loaded successfully; libretro API version: %u\n",
                     api_version());

              dlclose(handle);
              return 0;
          }
          EOF

          # Compile the validator with the same Freedesktop 25.08 SDK.
          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              cd "$GITHUB_WORKSPACE/FlycastCore"
              cc \
                -O2 \
                -o build-libretro/coinops_core_dlopen_test \
                build-libretro/coinops_core_dlopen_test.c \
                -ldl
              test -x build-libretro/coinops_core_dlopen_test
            '

          echo
          echo "Built core:"
          ls -lh FlycastCore/build-libretro/flycast_libretro.so
          sha256sum FlycastCore/build-libretro/flycast_libretro.so
          echo
          echo "Built dlopen validator:"
          ls -lh FlycastCore/build-libretro/coinops_core_dlopen_test

      - name: Validate Flycast core inside assembled CoinOPS Flatpak
        run: |
          set -euo pipefail

          TEST_DIR="build-dir/files/tmp/coinops-core-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cp \
            FlycastCore/build-libretro/flycast_libretro.so \
            "$TEST_DIR/"

          cp \
            FlycastCore/build-libretro/coinops_core_dlopen_test \
            "$TEST_DIR/"

          echo "============================================================"
          echo "Testing external Flycast .so in exact CoinOPS runtime"
          echo "============================================================"

          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/tmp/coinops-core-test/coinops_core_dlopen_test \
            /app/tmp/coinops-core-test/flycast_libretro.so

          echo
          echo "============================================================"
          echo "Runtime dependency check"
          echo "============================================================"

          DEP_REPORT="$(
            flatpak-builder \
              --run \
              build-dir \
              org.coinops.Runtime.yml \
              sh \
              -c '
                if command -v ldd >/dev/null 2>&1; then
                  ldd /app/tmp/coinops-core-test/flycast_libretro.so
                else
                  echo "ldd unavailable in runtime; dlopen test already passed"
                fi
              '
          )"

          printf '%s\n' "$DEP_REPORT"

          if printf '%s\n' "$DEP_REPORT" | grep -q "not found"; then
            echo "ERROR: Flycast core has unresolved runtime dependencies."
            exit 1
          fi

          rm -rf "$TEST_DIR"

      - name: Package shared CoinOPS libretro base
        run: |
          set -euo pipefail

          PACKAGE_ROOT="CoinOPS-Libretro-Base-linux-x86_64"
          LIBRETRO_ROOT="$PACKAGE_ROOT/emulators/libretro"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p \
            "$LIBRETRO_ROOT/autoconfig" \
            "$LIBRETRO_ROOT/shaders" \
            "$LIBRETRO_ROOT/overlays" \
            "$LIBRETRO_ROOT/cores" \
            "$PACKAGE_ROOT/tools"

          cat > "$LIBRETRO_ROOT/retroarch.cfg" <<'EOF'
          # CoinOPS shared RetroArch configuration
          #
          # This file contains settings shared by every CoinOPS libretro core.
          # Core-specific RetroArch overrides belong in:
          #   emulators/libretro/cores/<core-name>/core.cfg
          #
          # Per-core directories (system, saves, states, remaps and core options)
          # are injected by /app/bin/coinops-libretro at launch time so the entire
          # CoinOPS data tree remains movable.
          
          # Never rewrite this curated configuration on exit.
          config_save_on_exit = false
          
          # CoinOPS launches content directly; RetroArch is an invisible host.
          video_fullscreen = true
          video_windowed_fullscreen = true
          
          # The Flatpak exposes PulseAudio. On PipeWire systems this is serviced by
          # the PulseAudio compatibility layer.
          audio_driver = "pulse"
          
          # CoinOPS owns application lifecycle and should continue running content
          # if desktop focus changes transiently.
          pause_nonactive = false
          
          # Do not create implicit automatic savestates behind the frontend's back.
          savestate_auto_save = false
          savestate_auto_load = false
          
          # Menu/history/runtime bookkeeping is unnecessary for direct CoinOPS launches.
          history_list_enable = false
          content_runtime_log = false
          EOF

          # Preserve intentionally empty shared directories in artifacts.
          touch \
            "$LIBRETRO_ROOT/autoconfig/.keep" \
            "$LIBRETRO_ROOT/shaders/.keep" \
            "$LIBRETRO_ROOT/overlays/.keep" \
            "$LIBRETRO_ROOT/cores/.keep"

          cat > "$PACKAGE_ROOT/tools/validate-libretro-core.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          
          [[ $# -eq 1 ]] || { echo "Usage: $0 <core-package-directory>" >&2; exit 2; }
          CORE_ROOT="$1"
          
          fail() { echo "[FAIL] $*" >&2; exit 1; }
          pass() { echo "[PASS] $*"; }
          
          [[ -d "$CORE_ROOT" ]] || fail "core directory missing: $CORE_ROOT"
          [[ -f "$CORE_ROOT/core.cfg" ]] || fail "core.cfg missing"
          [[ -f "$CORE_ROOT/core-options.cfg" ]] || fail "core-options.cfg missing"
          
          for dir in system saves states remaps; do
              [[ -d "$CORE_ROOT/$dir" ]] || fail "$dir/ missing"
              pass "$dir/ exists"
          done
          
          if grep -Eq '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' "$CORE_ROOT/core.cfg"; then
              fail "core.cfg contains launcher-managed path keys"
          fi
          pass "core.cfg contains no launcher-managed path keys"
          
          mapfile -t libs < <(find "$CORE_ROOT" -maxdepth 1 -type f -name '*_libretro.so' -print | sort)
          [[ ${#libs[@]} -eq 1 ]] || fail "expected exactly one *_libretro.so; found ${#libs[@]}"
          CORE="${libs[0]}"
          pass "exactly one libretro core: $(basename "$CORE")"
          
          SYMBOLS_TMP="$(mktemp)"
          trap 'rm -f "$SYMBOLS_TMP"' EXIT
          nm -D "$CORE" | awk '{print $3}' > "$SYMBOLS_TMP"
          
          for symbol in retro_api_version retro_init retro_deinit retro_load_game retro_unload_game retro_run; do
              grep -Fxq "$symbol" "$SYMBOLS_TMP" || fail "missing export: $symbol"
              pass "export $symbol"
          done
          
          DEP_REPORT="$(ldd "$CORE" 2>&1 || true)"
          if grep -q 'not found' <<<"$DEP_REPORT"; then
              printf '%s\n' "$DEP_REPORT" >&2
              fail "unresolved shared-library dependency"
          fi
          pass "shared-library dependencies resolve"
          EOF
          chmod 0755 "$PACKAGE_ROOT/tools/validate-libretro-core.sh"

          cat > "$PACKAGE_ROOT/PACKAGE-CONTRACT.txt" <<'EOF'
          CoinOPS libretro core package contract
          ======================================
          
          Shared RetroArch host layer:
          
            emulators/libretro/
              retroarch.cfg
              autoconfig/
              shaders/
              overlays/
              cores/
          
          Every core is a self-contained package below:
          
            emulators/libretro/cores/<core-name>/
              <core>_libretro.so      exactly one *_libretro.so
              core.cfg                RetroArch overrides for this core
              core-options.cfg        libretro core options/defaults
              manifest.json           package/source metadata
              LICENSE.txt             core license
              system/                 BIOS/firmware/core writable system data
              saves/                  save RAM / memory-card-style frontend saves
              states/                 RetroArch save states
              remaps/                 RetroArch input remaps for this core
          
          Launcher-managed keys MUST NOT appear in core.cfg:
          
            system_directory
            savefile_directory
            savestate_directory
            core_options_path
            input_remapping_directory
          
          /app/bin/coinops-libretro injects those paths using an absolute generated
          .coinops-runtime.cfg on every launch. This guarantees that moving the entire
          CoinOPS data root never requires rewriting stored configuration.
          
          Shared resource directories are also injected by the launcher:
          
            joypad_autoconfig_dir -> emulators/libretro/autoconfig
            video_shader_dir      -> emulators/libretro/shaders
            overlay_directory     -> emulators/libretro/overlays
          
          Launch interface:
          
            coinops-libretro <core-name> <content> [additional content arguments...]
          
          Example:
          
            coinops-libretro flycast "/roms/Crazy Taxi (USA).chd"
          
          Future core packages should be rejected by CI unless they satisfy this layout
          and pass validate-libretro-core.sh (exports + runtime dependency checks).
          EOF

          cat > "$PACKAGE_ROOT/README.txt" <<'EOF'
          CoinOPS libretro base - Linux x86_64

          Merge the included "emulators" directory into the movable CoinOPS
          data root once. This installs the shared RetroArch configuration and
          shared libretro resource directories.

          Future core packages install only below:
            <CoinOPS>/emulators/libretro/cores/<core-name>/

          /app/bin/coinops-libretro also contains an immutable copy of the base
          configuration and will seed retroarch.cfg if it is ever missing; it
          never overwrites an existing mutable configuration.
          EOF

          echo "============================================================"
          echo "CoinOPS libretro base package"
          echo "============================================================"
          find "$PACKAGE_ROOT" -maxdepth 6 -printf '%p\n' | sort

      - name: Package mutable Flycast core
        run: |
          set -euo pipefail

          PACKAGE_ROOT="CoinOPS-Libretro-Flycast-linux-x86_64"
          CORE_ROOT="$PACKAGE_ROOT/emulators/libretro/cores/flycast"

          rm -rf "$PACKAGE_ROOT"

          mkdir -p \
            "$CORE_ROOT/system/dc" \
            "$CORE_ROOT/saves" \
            "$CORE_ROOT/states" \
            "$CORE_ROOT/remaps"

          cp \
            FlycastCore/build-libretro/flycast_libretro.so \
            "$CORE_ROOT/flycast_libretro.so"

          cp FlycastCore/LICENSE "$CORE_ROOT/LICENSE.txt"

          cat > "$CORE_ROOT/core.cfg" <<'EOF'
          # CoinOPS Flycast RetroArch overrides
          #
          # This file contains frontend settings specific to the Flycast core only.
          # The following keys are launcher-managed and must NOT be set here:
          #   system_directory
          #   savefile_directory
          #   savestate_directory
          #   core_options_path
          #   input_remapping_directory
          #
          # Intentionally no active overrides yet. The restructure should preserve the
          # known-working RetroArch/Flycast behavior first; renderer/performance tuning
          # belongs here once it has been tested deliberately.
          EOF

          cat > "$CORE_ROOT/core-options.cfg" <<'EOF'
          # CoinOPS Flycast libretro core options
          #
          # Generated from the option definitions exported by the exact core built from:
          #   CoinOPS-Official/flycast
          #   commit e7426bb864157a4c45866d6253bd24ae89f7d046
          #   upstream base Flycast v2.6
          #
          # These are the core's registered defaults, pinned explicitly so CoinOPS
          # behavior remains reproducible. Update this file when the pinned core changes.
          
          reicast_region = "USA"
          reicast_language = "English"
          reicast_hle_bios = "disabled"
          reicast_enable_dsp = "enabled"
          reicast_allow_service_buttons = "disabled"
          reicast_force_freeplay = "enabled"
          reicast_emulate_bba = "disabled"
          reicast_upnp = "enabled"
          reicast_dcnet = "disabled"
          reicast_internal_resolution = "640x480"
          reicast_cable_type = "TV (Composite)"
          reicast_broadcast = "NTSC"
          reicast_screen_rotation = "horizontal"
          reicast_alpha_sorting = "per-triangle (normal)"
          reicast_oit_abuffer_size = "512MB"
          reicast_oit_layers = "32"
          reicast_emulate_framebuffer = "disabled"
          reicast_enable_rttb = "disabled"
          reicast_mipmapping = "enabled"
          reicast_fog = "enabled"
          reicast_volume_modifier_enable = "enabled"
          reicast_anisotropic_filtering = "4"
          reicast_texture_filtering = "0"
          reicast_delay_frame_swapping = "enabled"
          reicast_detect_vsync_swap_interval = "disabled"
          reicast_pvr2_filtering = "disabled"
          reicast_texupscale = "1"
          reicast_texupscale_max_filtered_texture_size = "256"
          reicast_native_depth_interpolation = "disabled"
          reicast_fix_upscale_bleeding_edge = "enabled"
          reicast_threaded_rendering = "enabled"
          reicast_auto_skip_frame = "disabled"
          reicast_frame_skipping = "disabled"
          reicast_widescreen_cheats = "disabled"
          reicast_widescreen_hack = "disabled"
          reicast_gdrom_fast_loading = "disabled"
          reicast_dc_32mb_mod = "disabled"
          reicast_sh4clock = "200"
          reicast_custom_textures = "disabled"
          reicast_preload_custom_textures = "disabled"
          reicast_dump_textures = "disabled"
          reicast_dump_replaced_textures = "disabled"
          reicast_analog_stick_deadzone = "15%"
          reicast_trigger_deadzone = "0%"
          reicast_digital_triggers = "disabled"
          reicast_network_output = "disabled"
          reicast_show_lightgun_settings = "disabled"
          reicast_lightgun_crosshair_size_scaling = "100%"
          reicast_lightgun1_crosshair = "disabled"
          reicast_lightgun2_crosshair = "disabled"
          reicast_lightgun3_crosshair = "disabled"
          reicast_lightgun4_crosshair = "disabled"
          reicast_device_port1_slot1 = "VMU"
          reicast_device_port1_slot2 = "Purupuru"
          reicast_device_port2_slot1 = "VMU"
          reicast_device_port2_slot2 = "Purupuru"
          reicast_device_port3_slot1 = "VMU"
          reicast_device_port3_slot2 = "Purupuru"
          reicast_device_port4_slot1 = "VMU"
          reicast_device_port4_slot2 = "Purupuru"
          reicast_per_content_vmus = "disabled"
          reicast_vmu_sound = "disabled"
          reicast_show_vmu_screen_settings = "disabled"
          reicast_vmu1_screen_display = "disabled"
          reicast_vmu1_screen_position = "Upper Left"
          reicast_vmu1_screen_size_mult = "1x"
          reicast_vmu1_pixel_on_color = "DEFAULT_ON 00"
          reicast_vmu1_pixel_off_color = "DEFAULT_OFF 01"
          reicast_vmu1_screen_opacity = "100%"
          reicast_vmu2_screen_display = "disabled"
          reicast_vmu2_screen_position = "Upper Right"
          reicast_vmu2_screen_size_mult = "1x"
          reicast_vmu2_pixel_on_color = "DEFAULT_ON 00"
          reicast_vmu2_pixel_off_color = "DEFAULT_OFF 01"
          reicast_vmu2_screen_opacity = "100%"
          reicast_vmu3_screen_display = "disabled"
          reicast_vmu3_screen_position = "Lower Left"
          reicast_vmu3_screen_size_mult = "1x"
          reicast_vmu3_pixel_on_color = "DEFAULT_ON 00"
          reicast_vmu3_pixel_off_color = "DEFAULT_OFF 01"
          reicast_vmu3_screen_opacity = "100%"
          reicast_vmu4_screen_display = "disabled"
          reicast_vmu4_screen_position = "Lower Right"
          reicast_vmu4_screen_size_mult = "1x"
          reicast_vmu4_pixel_on_color = "DEFAULT_ON 00"
          reicast_vmu4_pixel_off_color = "DEFAULT_OFF 01"
          reicast_vmu4_screen_opacity = "100%"
          EOF

          # Preserve intentionally empty mutable directories in artifacts.
          touch \
            "$CORE_ROOT/saves/.keep" \
            "$CORE_ROOT/states/.keep" \
            "$CORE_ROOT/remaps/.keep"

          CORE_SHA256="$(
            sha256sum "$CORE_ROOT/flycast_libretro.so" \
              | awk "{print \$1}"
          )"

          cat > "$CORE_ROOT/manifest.json" <<EOF
          {
            "name": "Flycast",
            "package_name": "flycast",
            "type": "libretro-core",
            "platform": "linux-x86_64",
            "source_repository": "CoinOPS-Official/flycast",
            "source_commit": "e7426bb864157a4c45866d6253bd24ae89f7d046",
            "upstream_base": "Flycast v2.6",
            "flatpak_runtime": "org.freedesktop.Platform/25.08",
            "core_path": "cores/flycast/flycast_libretro.so",
            "core_config": "cores/flycast/core.cfg",
            "core_options": "cores/flycast/core-options.cfg",
            "sha256": "$CORE_SHA256"
          }
          EOF

          cat > "$CORE_ROOT/system/dc/README-BIOS.txt" <<'EOF'
          Flycast firmware / arcade BIOS directory

          Place required firmware in this directory.

          Common filenames:
            dc_boot.bin   Dreamcast BIOS (optional; HLE BIOS is available)
            dc_flash.bin  Dreamcast flash
            naomi.zip     NAOMI BIOS
            naomi2.zip    NAOMI 2 BIOS
            awbios.zip    Atomiswave BIOS
            segasp.zip    Sega System SP BIOS

          BIOS files are not distributed with CoinOPS.

          Flycast also writes VMU/NVRAM-style system data below this managed
          system directory. Keep it writable.
          EOF

          cat > "$PACKAGE_ROOT/README.txt" <<'EOF'
          CoinOPS Flycast libretro core - Linux x86_64

          Install the CoinOPS libretro base package once, then merge this
          package's "emulators" directory into the movable CoinOPS data root.

          Result:
            <CoinOPS>/emulators/libretro/cores/flycast/
              flycast_libretro.so
              core.cfg
              core-options.cfg
              manifest.json
              LICENSE.txt
              system/
              saves/
              states/
              remaps/

          Launch contract:
            coinops-libretro flycast <content>

          The core was built against the same Freedesktop 25.08 SDK used by
          org.coinops.Runtime and was dlopen-tested inside the assembled
          CoinOPS Flatpak before packaging.
          EOF

          echo "============================================================"
          echo "Validating Flycast package contract"
          echo "============================================================"

          test -f "$CORE_ROOT/core.cfg"
          test -f "$CORE_ROOT/core-options.cfg"
          test -f "$CORE_ROOT/manifest.json"
          test -f "$CORE_ROOT/LICENSE.txt"
          test -d "$CORE_ROOT/system"
          test -d "$CORE_ROOT/saves"
          test -d "$CORE_ROOT/states"
          test -d "$CORE_ROOT/remaps"

          if grep -Eq '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' "$CORE_ROOT/core.cfg"; then
            echo "ERROR: core.cfg contains launcher-managed path settings"
            exit 1
          fi

          CORE_COUNT="$(find "$CORE_ROOT" -maxdepth 1 -type f -name '*_libretro.so' | wc -l)"
          test "$CORE_COUNT" -eq 1

          # Verify that the pre-populated options file came from the exact
          # registered Flycast option namespace and contains the expected set.
          grep -q '^reicast_region = "USA"$' "$CORE_ROOT/core-options.cfg"
          grep -q '^reicast_threaded_rendering = "enabled"$' "$CORE_ROOT/core-options.cfg"
          OPTION_COUNT="$(grep -Ec '^reicast_[A-Za-z0-9_]+ = ' "$CORE_ROOT/core-options.cfg")"
          test "$OPTION_COUNT" -eq 87

          echo "Flycast core package contains $OPTION_COUNT pinned core options."
          echo
          find "$PACKAGE_ROOT" -maxdepth 8 -printf '%p\n' | sort
          echo
          du -sh "$PACKAGE_ROOT"
          sha256sum "$CORE_ROOT/flycast_libretro.so"

      - name: Validate packaged Flycast core contract in Freedesktop SDK
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              "$GITHUB_WORKSPACE/CoinOPS-Libretro-Base-linux-x86_64/tools/validate-libretro-core.sh" \
                "$GITHUB_WORKSPACE/CoinOPS-Libretro-Flycast-linux-x86_64/emulators/libretro/cores/flycast"
            '

      # ============================================================
      # Build distributable Flatpak bundle
      # ============================================================

      - name: Build Flatpak bundle
        run: |
          echo "Creating native Flatpak bundle..."
          (
            while true; do
              echo "Still building Flatpak bundle: $(date)"
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap \
            'kill "$HEARTBEAT_PID" 2>/dev/null || true' \
            EXIT
          flatpak build-bundle \
            repo \
            CoinOPS-Runtime-Native-x86_64.flatpak \
            org.coinops.Runtime \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          echo
          echo "Bundle complete:"
          ls -lh CoinOPS-Runtime-Native-x86_64.flatpak
          echo
          echo "Bundle byte size:"
          stat \
            --printf='%s bytes\n' \
            CoinOPS-Runtime-Native-x86_64.flatpak
      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload native CoinOPS Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: CoinOPS-Runtime-Native-x86_64.flatpak
          path: CoinOPS-Runtime-Native-x86_64.flatpak
          if-no-files-found: error

      - name: Upload shared CoinOPS libretro base
        uses: actions/upload-artifact@v7
        with:
          name: CoinOPS-Libretro-Base-linux-x86_64
          path: CoinOPS-Libretro-Base-linux-x86_64
          if-no-files-found: error
          compression-level: 6

      - name: Upload mutable Flycast libretro core
        uses: actions/upload-artifact@v7
        with:
          name: CoinOPS-Libretro-Flycast-linux-x86_64
          path: CoinOPS-Libretro-Flycast-linux-x86_64
          if-no-files-found: error
          compression-level: 6
