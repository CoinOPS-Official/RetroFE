name: CoinOPS Runtime - Native Flatpak x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64

    name: Build Native CoinOPS Flatpak x86_64

    steps:
      # ============================================================
      # Checkout current CoinOPS repository
      #
      # Keep everything in the current repository for now. The repo is
      # checked out into RetroFE/ so the Flatpak manifest can consume the
      # RetroFE source tree without copying the GitHub Actions workspace,
      # MAME checkout, or persistent flatpak-builder cache into a module.
      #
      # clean: true keeps the RetroFE source copy deterministic. Persistent
      # flatpak-builder state lives at the workspace root, outside RetroFE/.
      # ============================================================

      - name: Checkout current CoinOPS repository
        uses: actions/checkout@v6
        with:
          clean: false

      # ============================================================
      # Checkout custom MAME fork
      # ============================================================

      - name: Checkout MAME fork
        uses: actions/checkout@v6
        with:
          repository: CoinOPS-Official/MAME-FFMpeg
          ref: mame0285-local
          path: MAME
          token: ${{ secrets.MAME_REPO_TOKEN }}
          clean: false
          fetch-depth: 1

      # ============================================================
      # Show exact source revisions
      # ============================================================

      - name: Show source revisions
        run: |
          echo "============================================================"
          echo "Current CoinOPS / RetroFE revision"
          echo "============================================================"
          git -C RetroFE rev-parse HEAD
          echo
          echo "============================================================"
          echo "MAME revision"
          echo "============================================================"
          git -C MAME rev-parse HEAD
      # ============================================================
      # Verify host build tools
      #
      # Install once on self-hosted Arch/CachyOS:
      #
      # sudo pacman -S --needed flatpak flatpak-builder git
      # ============================================================

      - name: Verify host build tools
        run: |
          set -e
          echo "============================================================"
          echo "HOST"
          echo "============================================================"
          uname -a
          echo
          echo "CPU:"
          lscpu | grep -E \
            'Model name|Socket|Core\(s\)|Thread\(s\)|CPU\(s\)' \
            || true
          echo
          echo "Available logical CPUs:"
          nproc
          echo
          echo "Memory:"
          free -h
          echo
          echo "Disk:"
          df -h .
          echo
          echo "============================================================"
          echo "TOOLS"
          echo "============================================================"
          git --version
          flatpak --version
          flatpak-builder --version
      # ============================================================
      # Configure Flathub
      # ============================================================

      - name: Configure Flathub
        run: |
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      # ============================================================
      # Install matching Freedesktop runtime + SDK
      # ============================================================

      - name: Install Freedesktop 25.08 runtime and SDK
        run: |
          flatpak install \
            --user \
            --noninteractive \
            flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08
      # ============================================================
      # Audit Freedesktop SDK/runtime dependency baseline
      #
      # Policy:
      #   - Runtime owns dependencies required by every CoinOPS build.
      #   - A dependency used by one emulator/core stays with that package.
      #   - Promote a dependency into Runtime only when multiple payloads
      #     genuinely share it or the dependency cannot be safely bundled.
      #
      # Freedesktop 25.08 already supplies the broad graphics/audio/system
      # ABI expected by libretro cores. SDL2_image and SDL2_ttf are built
      # explicitly below because 25.08 removed those SDL2 add-on projects.
      # ============================================================

      - name: Audit emulator dependency baseline
        run: |
          set -euo pipefail

          flatpak run \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              require_pkg() {
                pkg="$1"
                printf "%-28s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "MISSING"
                  exit 1
                fi
              }

              optional_pkg() {
                pkg="$1"
                printf "%-28s " "$pkg"
                if pkg-config --exists "$pkg"; then
                  pkg-config --modversion "$pkg"
                else
                  echo "not supplied by base runtime (bundle per payload if needed)"
                fi
              }

              echo "============================================================"
              echo "REQUIRED COINOPS / COMMON EMULATOR ABI"
              echo "============================================================"

              for pkg in \
                sdl2 \
                SDL2_mixer \
                gstreamer-1.0 \
                gstreamer-app-1.0 \
                gstreamer-video-1.0 \
                fontconfig \
                libcurl \
                libusb-1.0 \
                libudev \
                zlib \
                libwebp \
                vulkan \
                egl \
                gl \
                x11 \
                wayland-client \
                libpulse \
                liblzma \
                libzstd \
                liblz4 \
                openssl \
                ogg \
                vorbis \
                vorbisenc \
                vorbisfile \
                openal
              do
                require_pkg "$pkg"
              done

              echo
              echo "============================================================"
              echo "EXPECTED TO BE PROVIDED BY /APP MODULES"
              echo "============================================================"

              for pkg in \
                SDL2_image \
                SDL2_ttf \
                libzip \
                libevdev \
                libserialport \
                minizip
              do
                optional_pkg "$pkg"
              done

              echo
              echo "============================================================"
              echo "CORE-SPECIFIC / DO NOT PROMOTE WITHOUT A REAL NEED"
              echo "============================================================"

              for pkg in \
                libxxhash \
                snappy
              do
                optional_pkg "$pkg"
              done

              echo
              echo "============================================================"
              echo "COMPILER RUNTIME LIBRARIES"
              echo "============================================================"

              for soname in \
                libstdc++.so.6 \
                libgcc_s.so.1 \
                libgomp.so.1
              do
                printf "%-28s " "$soname"
                if find /usr/lib /lib \
                  -name "$soname" \
                  -print \
                  -quit \
                  2>/dev/null \
                  | grep -q .
                then
                  echo "FOUND"
                else
                  echo "MISSING"
                  exit 1
                fi
              done

              echo
              echo "============================================================"
              echo "CCACHE"
              echo "============================================================"

              command -v ccache
              ccache --version | head -1
            '
      # ============================================================
      # Create launcher + desktop metadata
      # ============================================================

      - name: Create Flatpak metadata
        run: |
          mkdir -p Packaging/Flatpak
          cat > Packaging/Flatpak/coinops-launcher <<'EOF'
          #!/bin/sh
          set -eu
          if [ "$#" -lt 1 ]; then
              echo "Usage:"
              echo "  flatpak run org.coinops.Runtime <CoinOPS build folder>"
              echo
              echo "Example:"
              echo '  flatpak run org.coinops.Runtime "$HOME/CoinOPS Arise"'
              exit 1
          fi
          COINOPS_ROOT="$1"
          shift
          if [ ! -d "$COINOPS_ROOT" ]; then
              echo "CoinOPS build folder not found:"
              echo "  $COINOPS_ROOT"
              exit 1
          fi
          if [ ! -f "$COINOPS_ROOT/settings.conf" ]; then
              echo "settings.conf not found in CoinOPS build folder:"
              echo "  $COINOPS_ROOT"
              exit 1
          fi
          export RETROFE_PATH="$COINOPS_ROOT"
          cd "$COINOPS_ROOT"
          exec /app/bin/retrofe "$@"
          EOF
          chmod +x Packaging/Flatpak/coinops-launcher
          cat > Packaging/Flatpak/coinops-runtime.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CoinOPS Runtime
          Comment=CoinOPS Runtime
          Exec=coinops-launcher
          Icon=org.coinops.Runtime
          Terminal=false
          Categories=Game;
          EOF
          cp \
            RetroFE/Package/Environment/Common/RetroFE.png \
            Packaging/Flatpak/coinops-runtime.png
      # ============================================================
      # Create native Flatpak manifest
      #
      # Module order is deliberate:
      #
      #   SDL2_ttf
      #   MAME
      #   SDL2_image
      #   libzip
      #   Hypseus Singe (last SDL2 release)
      #   libevdev
      #   libserialport
      #   minizip
      #   RetroFE
      #   stripped RetroArch runtime
      #   CoinOPS generic libretro launcher
      #   runtime-cleanup
      #   launcher metadata
      #
      # SDL2_ttf must precede MAME because MAME requires it.
      #
      # SDL2_image, libzip, Hypseus Singe and RetroFE-only dependencies
      # remain after MAME so changes to them do not invalidate MAME.
      #
      # RetroArch is deliberately placed after RetroFE. Updating the
      # pinned RetroArch revision or its build flags therefore does not
      # invalidate either the expensive MAME module or RetroFE.
      # ============================================================

      - name: Create native Flatpak manifest
        run: |
          cat > org.coinops.Runtime.yml <<'EOF'
          app-id: org.coinops.Runtime
          runtime: org.freedesktop.Platform
          runtime-version: '25.08'
          sdk: org.freedesktop.Sdk
          command: coinops-launcher
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=wayland
            - --socket=fallback-x11
            - --socket=pulseaudio
            - --device=all
            # RetroFE uses flatpak-spawn --host for AppImage launchers.
            # This is intentionally host-command access and must remain explicit.
            - --talk-name=org.freedesktop.Flatpak
            - --filesystem=/run/udev:ro
            - --filesystem=home
            - --filesystem=/run/media
            - --filesystem=/media
            - --filesystem=/mnt
          modules:
            # ======================================================
            # SDL2_ttf
            #
            # Required by MAME and RetroFE.
            # ======================================================
            - name: SDL2_ttf
              buildsystem: cmake-ninja
              builddir: true
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
                - -DBUILD_SHARED_LIBS=ON
                - -DSDL2TTF_SAMPLES=OFF
              cleanup:
                - /include
                - /lib/cmake
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/libsdl-org/SDL_ttf.git
                  branch: SDL2
            # ======================================================
            # Custom MAME
            #
            # MAME depends on SDL2_ttf, so it comes immediately after
            # SDL2_ttf and before RetroFE-only dependencies.
            #
            # Host:
            #   6 physical cores
            #   12 logical CPUs
            #
            # Use 10 jobs to leave some headroom.
            #
            # Debug info is explicitly disabled because previous full
            # links overflowed 32-bit DWARF relocations.
            # ======================================================
            - name: mame
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
                cflags-override: true
                cxxflags-override: true
                cflags: -O2 -g0
                cxxflags: -O2 -g0
              build-commands:
                - |
                  echo "============================================================"
                  echo "MAME build environment"
                  echo "============================================================"
                  echo "Compiler:"
                  c++ --version
                  echo
                  echo "Available logical CPUs:"
                  nproc
                  echo
                  echo "Configured MAME parallel jobs:"
                  echo "10"
                  echo
                  echo "Environment flags:"
                  echo "CFLAGS=${CFLAGS:-}"
                  echo "CXXFLAGS=${CXXFLAGS:-}"
                  echo "LDFLAGS=${LDFLAGS:-}"
                  echo
                  echo "============================================================"
                  echo "Building custom MAME inside Freedesktop SDK"
                  echo "============================================================"
                  MAME_JOBS=10
                  # SOURCEFILTER can change which translation units belong to each
                  # subtarget library. Remove only the generated CoinOPS archives so
                  # stale library membership cannot survive an incremental build.
                  #
                  # Object files and ccache are preserved, so this is cheap compared
                  # with a clean MAME rebuild.
                  echo "Removing stale CoinOPS static archives..."
                  find build \
                    -type f \
                    -path '*/mame_coinops/*.a' \
                    -print \
                    -delete \
                    2>/dev/null \
                    || true
                  echo
                  echo "Building MAME with ${MAME_JOBS} parallel jobs"
                  set -o pipefail
                  if ! make \
                    -j"${MAME_JOBS}" \
                    SUBTARGET=coinops \
                    SOURCEFILTER=src/mame/coinops.flt \
                    REGENIE=1 \
                    SYMBOLS=0 \
                    SYMLEVEL=0 \
                    ARCHOPTS="-g0" \
                    USE_FFMPEG=0 \
                    TOOLS=0 \
                    TESTS=0 \
                    BENCHMARKS=0 \
                    USE_QTDEBUG=0 \
                    NO_USE_MIDI=1 \
                    NO_USE_PORTAUDIO=1 \
                    USE_TAPTUN=0 \
                    USE_PCAP=0 \
                    2>&1 \
                    | tee mame-build.log \
                    | awk '
                        /Compiling/ || /Archiving/ || /Compressing/ || /Generating/ {
                          progress++
                          if (progress == 1 || progress % 100 == 0) {
                            printf "[MAME] %d build steps completed... %s\\n", progress, $0
                            fflush()
                          }
                          next
                        }
                        {
                          print
                          fflush()
                        }
                      '
                  then
                    echo
                    echo "============================================================"
                    echo "MAME BUILD FAILED - LAST 200 LOG LINES"
                    echo "============================================================"
                    tail -200 mame-build.log || true
                    exit 1
                  fi
                  test -x coinops
                  echo
                  echo "============================================================"
                  echo "Built CoinOPS MAME subtarget"
                  echo "============================================================"
                  ./coinops -version
                  ls -lh coinops
                  du -h coinops
                  # Install under the standard runtime name expected by RetroFE.
                  install -Dm755 coinops /app/bin/mame
              sources:
                - type: git
                  path: MAME
                  branch: mame0285-local
            # ======================================================
            # SDL2_image
            #
            # Load:
            #   PNG
            #   JPG/JPEG
            #   QOI
            #   WebP
            #   GIF
            #
            # Save:
            #   PNG only
            #
            # PNG_SAVE is required by RetroFE IMG_SavePNG() for
            # generated QR codes.
            # ======================================================
            - name: SDL2_image
              buildsystem: cmake-ninja
              builddir: true
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
                - -DBUILD_SHARED_LIBS=ON
                - -DSDL2IMAGE_SAMPLES=OFF
                - -DSDL2IMAGE_TESTS=OFF
                # Formats used by the CoinOPS runtime.
                - -DSDL2IMAGE_PNG=ON
                - -DSDL2IMAGE_JPG=ON
                - -DSDL2IMAGE_QOI=ON
                - -DSDL2IMAGE_WEBP=ON
                - -DSDL2IMAGE_GIF=ON
                # PNG writing required for generated QR codes.
                - -DSDL2IMAGE_PNG_SAVE=ON
                # JPEG writing not required.
                - -DSDL2IMAGE_JPG_SAVE=OFF
                # Disable unused formats.
                - -DSDL2IMAGE_AVIF=OFF
                - -DSDL2IMAGE_BMP=OFF
                - -DSDL2IMAGE_JXL=OFF
                - -DSDL2IMAGE_LBM=OFF
                - -DSDL2IMAGE_PCX=OFF
                - -DSDL2IMAGE_PNM=OFF
                - -DSDL2IMAGE_SVG=OFF
                - -DSDL2IMAGE_TGA=OFF
                - -DSDL2IMAGE_TIF=OFF
                - -DSDL2IMAGE_XCF=OFF
                - -DSDL2IMAGE_XPM=OFF
                - -DSDL2IMAGE_XV=OFF
              cleanup:
                - /include
                - /lib/cmake
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/libsdl-org/SDL_image.git
                  branch: SDL2
            # ======================================================
            # libzip
            #
            # Required by Hypseus Singe for zipped LUA game support.
            # Build it into /app rather than depending on the SDK's
            # optional package set.
            # ======================================================
            - name: libzip
              buildsystem: cmake-ninja
              builddir: true
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
                - -DBUILD_SHARED_LIBS=ON
                - -DBUILD_TOOLS=OFF
                - -DBUILD_REGRESS=OFF
                - -DBUILD_OSSFUZZ=OFF
                - -DBUILD_EXAMPLES=OFF
                - -DBUILD_DOC=OFF
              cleanup:
                - /include
                - /lib/cmake
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/nih-at/libzip.git
                  commit: 6f8a0cdd24a0dc6cce9dac4a7679da784ab124ea
            # ======================================================
            # Hypseus Singe
            #
            # v2.12.1 is the final SDL2-based Hypseus release.
            # Only the immutable emulator executable and license are
            # installed. Game data and mutable support directories
            # remain in the external CoinOPS data tree.
            # ======================================================
            - name: hypseus-singe
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
                cflags-override: true
                cxxflags-override: true
                # Hypseus only propagates the base SDL2 include path.
                # Its video targets also include SDL_ttf.h and SDL_image.h,
                # which are supplied by the /app SDL2 add-on modules.
                cflags: -O2 -g0 -I/app/include/SDL2
                cxxflags: -O2 -g0 -I/app/include/SDL2
              build-commands:
                - |
                  echo "============================================================"
                  echo "Checking Hypseus Singe build dependencies"
                  echo "============================================================"
                  for tool in cmake make libtoolize autoreconf; do
                    command -v "$tool"
                  done
                  for pkg in \
                    sdl2 \
                    SDL2_ttf \
                    SDL2_image \
                    SDL2_mixer \
                    ogg \
                    vorbis \
                    vorbisenc \
                    vorbisfile \
                    zlib \
                    libzip
                  do
                    printf '%-20s ' "$pkg"
                    pkg-config --modversion "$pkg"
                  done
                  echo
                  echo "SDL2 add-on compiler flags:"
                  pkg-config --cflags SDL2_ttf SDL2_image
                  test -f /app/include/SDL2/SDL_ttf.h
                  test -f /app/include/SDL2/SDL_image.h
                - |
                  echo
                  echo "============================================================"
                  echo "Configuring Hypseus Singe v2.12.1 (SDL2)"
                  echo "============================================================"
                  # Hypseus's bundled libmpeg2 ExternalProject does not declare
                  # libmpeg2.a as a Ninja BUILD_BYPRODUCT. Use the upstream
                  # Unix Makefiles path so libmpeg2 is built before Hypseus links.
                  rm -rf build
                  cmake \
                    -S src \
                    -B build \
                    -G "Unix Makefiles" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/app \
                    -DCMAKE_PREFIX_PATH=/app \
                    -DBUILD_SINGE=ON \
                    -DABSTRACT_SINGE=ON \
                    -DBUILDBOT=OFF
                - |
                  echo
                  echo "============================================================"
                  echo "Building Hypseus Singe"
                  echo "============================================================"
                  cmake --build build --parallel 10
                - test -x build/hypseus
                - install -Dm755 build/hypseus /app/bin/hypseus
                - install -Dm644 LICENSE /app/share/licenses/hypseus-singe/LICENSE
              sources:
                - type: git
                  url: https://github.com/DirtBagXon/hypseus-singe.git
                  commit: 4cfd20d834ee6cf42c1c347ffd2627d87aaf8e2f
            # ======================================================
            # libevdev
            # ======================================================
            - name: libevdev
              buildsystem: meson
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - -Dtests=disabled
                - -Ddocumentation=disabled
              cleanup:
                - /bin/libevdev-tweak-device
                - /bin/mouse-dpi-tool
                - /bin/touchpad-edge-detector
                - /include
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://gitlab.freedesktop.org/libevdev/libevdev.git
                  branch: master
            # ======================================================
            # libserialport
            # ======================================================
            - name: libserialport
              buildsystem: autotools
              build-options:
                strip: true
                no-debuginfo: true
              config-opts:
                - --disable-static
                - --enable-shared
              cleanup:
                - /include
                - /lib/pkgconfig
                - '*.a'
                - '*.la'
              sources:
                - type: git
                  url: https://github.com/martinling/libserialport.git
                  branch: master
            # ======================================================
            # Classic Minizip
            #
            # Required by ThirdParty/openhi2txt.
            #
            # Headers are temporarily installed into /app/include so
            # RetroFE can compile against them.
            #
            # The final runtime-cleanup module removes the headers
            # after RetroFE has finished building.
            # ======================================================
            - name: minizip
              buildsystem: simple
              subdir: contrib/minizip
              build-options:
                strip: true
                no-debuginfo: true
              build-commands:
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c ioapi.c \
                    -o ioapi.o
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c unzip.c \
                    -o unzip.o
                - |
                  cc \
                    -fPIC \
                    -O2 \
                    -I. \
                    -c zip.c \
                    -o zip.o
                - |
                  cc \
                    -shared \
                    -Wl,-soname,libminizip.so.1 \
                    -o libminizip.so.1.0.0 \
                    ioapi.o \
                    unzip.o \
                    zip.o \
                    -lz
                - ln -sf libminizip.so.1.0.0 libminizip.so.1
                - ln -sf libminizip.so.1 libminizip.so
                - install -Dm755 libminizip.so.1.0.0 /app/lib/libminizip.so.1.0.0
                - ln -sf libminizip.so.1.0.0 /app/lib/libminizip.so.1
                - ln -sf libminizip.so.1 /app/lib/libminizip.so
                - install -Dm644 unzip.h /app/include/minizip/unzip.h
                - install -Dm644 zip.h /app/include/minizip/zip.h
                - install -Dm644 ioapi.h /app/include/minizip/ioapi.h
              sources:
                - type: git
                  url: https://github.com/madler/zlib.git
                  tag: v1.3.1
            # ======================================================
            # RetroFE
            #
            # Flatpak-builder copies the CONTENTS of the RetroFE
            # directory into the module build root.
            # ======================================================
            - name: retrofe
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
              build-commands:
                - |
                  echo "============================================================"
                  echo "Checking required RetroFE dependencies"
                  echo "============================================================"
                  check_pkg() {
                    PKG="$1"
                    if pkg-config --exists "$PKG"; then
                      VERSION="$(pkg-config --modversion "$PKG")"
                      echo "[FOUND] $PKG $VERSION"
                    else
                      echo "[MISSING] $PKG"
                      exit 1
                    fi
                  }
                  echo
                  echo "--- SDL ---"
                  check_pkg sdl2
                  check_pkg SDL2_image
                  check_pkg SDL2_ttf
                  check_pkg SDL2_mixer
                  echo
                  echo "--- GStreamer ---"
                  check_pkg gstreamer-1.0
                  check_pkg gstreamer-app-1.0
                  check_pkg gstreamer-video-1.0
                  echo
                  echo "--- Other dependencies ---"
                  check_pkg fontconfig
                  check_pkg libcurl
                  check_pkg libusb-1.0
                  check_pkg libevdev
                  check_pkg libudev
                  check_pkg zlib
                  check_pkg libwebp
                  check_pkg libserialport
                  echo
                  echo "--- Minizip ---"
                  if [ -f /app/include/minizip/unzip.h ] && \
                     [ -f /app/lib/libminizip.so ]; then
                    echo "[FOUND] classic minizip"
                  else
                    echo "[MISSING] classic minizip"
                    exit 1
                  fi
                - |
                  echo
                  echo "============================================================"
                  echo "Configuring RetroFE"
                  echo "============================================================"
                  cmake \
                    -S Source \
                    -B Build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH=/app \
                    -DCMAKE_INSTALL_PREFIX=/app \
                    -DMINIZIP_INCLUDE_DIR=/app/include/minizip \
                    -DMINIZIP_LIBRARY=/app/lib/libminizip.so
                - |
                  echo
                  echo "============================================================"
                  echo "Building RetroFE"
                  echo "============================================================"
                  cmake \
                    --build Build \
                    --parallel 10
                - test -x Build/retrofe
                - install -Dm755 Build/retrofe /app/bin/retrofe
              sources:
                - type: dir
                  path: RetroFE
                  skip:
                    - .git
                    - .github
            # ======================================================
            # Stripped RetroArch libretro runtime
            #
            # Purpose:
            #   Command-line-only libretro host for systems MAME does
            #   not handle well enough. No RetroArch menu/UI assets,
            #   databases, updater, achievements, or media player.
            #
            # Kept deliberately:
            #   - dynamic external core loading
            #   - config/core options/save/state/disk/VFS support
            #   - SDL2 + udev input and rumble
            #   - OpenGL/OpenGL Core + Vulkan hardware contexts
            #   - Wayland + X11/EGL/GLX presentation
            #   - overlays/bezels
            #   - GLSL + Slang shaders with bundled glslang
            #   - microphone API support (needed by some DS titles)
            #
            # Cores, shaders, overlays, configs, BIOS/system files,
            # saves and states are intentionally NOT installed here.
            # They live in the mutable CoinOPS data tree and are passed
            # to this executable by path.
            #
            # Pin to RetroArch v1.22.2 release commit for reproducible
            # builds. This is an unmodified GPLv3 upstream binary, only
            # configured with a reduced feature set and renamed on install.
            # ======================================================
            - name: retroarch-runtime
              buildsystem: simple
              build-options:
                strip: true
                no-debuginfo: true
                cflags-override: true
                cxxflags-override: true
                cflags: -O2 -g0
                cxxflags: -O2 -g0
              build-commands:
                # RetroArch v1.22.2 no-menu regression: these netplay state
                # variables are declared only in the HAVE_MENU branch but are
                # used unconditionally later in runloop_iterate(). Patch the
                # pinned source minimally before configuration.
                - |
                  python3 -c 'from pathlib import Path; p=Path("runloop.c"); s=p.read_text(); old="#else\n   bool core_paused                       = (runloop_st->flags & RUNLOOP_FLAG_PAUSED) ? true : false;\n#endif\n"; new="#else\n#ifdef HAVE_NETWORKING\n   bool netplay_allow_timeskip            = netplay_driver_ctl(RARCH_NETPLAY_CTL_ALLOW_TIMESKIP, NULL);\n   bool netplay_allow_pause               = netplay_driver_ctl(RARCH_NETPLAY_CTL_ALLOW_PAUSE, NULL);\n#else\n   bool netplay_allow_timeskip            = false;\n   bool netplay_allow_pause               = false;\n#endif\n   bool core_paused                       = (runloop_st->flags & RUNLOOP_FLAG_PAUSED) ? true : false;\n#endif\n"; assert old in s, "Expected RetroArch v1.22.2 no-menu runloop block not found"; p.write_text(s.replace(old,new,1)); print("Applied CoinOPS RetroArch no-menu runloop fix")'
                # RetroArch v1.22.2 no-menu regression: runtime_file.c uses
                # runloop_state_t/runloop_state_get_ptr(), but only receives
                # runloop.h transitively through menu headers in normal builds.
                # Include the dependency directly for a no-menu build.
                - |
                  python3 -c 'from pathlib import Path; p=Path("runtime_file.c"); s=p.read_text(); old="#include \"msg_hash.h\"\n"; new="#include \"msg_hash.h\"\n#include \"runloop.h\"\n"; assert old in s, "Expected RetroArch v1.22.2 runtime_file include block not found"; p.write_text(s.replace(old,new,1)); print("Applied CoinOPS RetroArch runtime_file no-menu include fix")'
                - |
                  echo "============================================================"
                  echo "Configuring stripped RetroArch runtime"
                  echo "============================================================"
                  ./configure \
                    --prefix=/app \
                    --disable-menu \
                    --enable-gfx_widgets \
                    --disable-rgui \
                    --disable-materialui \
                    --disable-xmb \
                    --disable-ozone \
                    --disable-qt \
                    --disable-libretrodb \
                    --disable-core_info_cache \
                    --disable-online_updater \
                    --disable-update_cores \
                    --disable-update_core_info \
                    --disable-update_assets \
                    --disable-imageviewer \
                    --disable-video_filter \
                    --disable-dsp_filter \
                    --disable-ffmpeg \
                    --disable-mpv \
                    --disable-ssa \
                    --disable-networkgamepad \
                    --disable-netplaydiscovery \
                    --disable-discord \
                    --disable-cheevos \
                    --disable-cheevos_rvz \
                    --disable-accessibility \
                    --disable-translate \
                    --disable-runahead \
                    --disable-rewind \
                    --disable-bsv_movie \
                    --disable-audiomixer \
                    --disable-videoprocessor \
                    --disable-langextra \
                    --enable-shaderpipeline \
                    --disable-opengl1 \
                    --disable-vulkan_display \
                    --disable-vg \
                    --disable-cg \
                    --disable-kms \
                    --disable-cdrom \
                    --disable-crtswitchres \
                    --disable-test_drivers \
                    --enable-overlay \
                    --enable-dynamic \
                    --enable-sdl2 \
                    --enable-udev \
                    --enable-threads \
                    --enable-opengl \
                    --enable-opengl_core \
                    --enable-vulkan \
                    --enable-wayland \
                    --enable-x11 \
                    --enable-egl \
                    --enable-glx \
                    --enable-pulse \
                    --disable-pipewire \
                    --enable-glsl \
                    --enable-slang \
                    --enable-glslang \
                    --enable-builtinglslang \
                    --enable-spirv_cross \
                    --enable-microphone
                - |
                  echo
                  echo "============================================================"
                  echo "Building stripped RetroArch runtime"
                  echo "============================================================"
                  make -j10
                - test -x retroarch
                - install -Dm755 retroarch /app/bin/coinops-retroarch
                - install -Dm644 COPYING /app/share/licenses/coinops-retroarch/COPYING
                - |
                  echo
                  echo "============================================================"
                  echo "RetroArch compiled feature report"
                  echo "============================================================"
                  /app/bin/coinops-retroarch --features || true
              sources:
                - type: git
                  url: https://github.com/libretro/RetroArch.git
                  commit: 69a4f0ea1e8aaf442ae4858f2e7f2b31a1776576
            # ======================================================
            # CoinOPS generic libretro launcher
            #
            # The Runtime owns execution mechanics only.
            #
            # CoinOPS-Libretro owns:
            #   emulators/libretro/retroarch.cfg
            #   cores/<core-name>/core.cfg
            #   cores/<core-name>/core-options.cfg
            #   core binaries, system assets, saves/states/remaps
            #
            # Keeping configuration payloads out of /app lets the
            # CoinOPS-Libretro repository version and update them
            # independently from this immutable Runtime Flatpak.
            # ======================================================
            - name: coinops-libretro-launcher
              buildsystem: simple
              build-commands:
                - |
                  install -d /app/bin
                  cat > /app/bin/coinops-libretro <<'COINOPS_LIBRETRO_SCRIPT'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  usage() {
                      echo "Usage: coinops-libretro <core-name> <content> [additional content arguments...]" >&2
                      exit 2
                  }

                  [[ $# -ge 2 ]] || usage

                  CORE_NAME="$1"
                  shift

                  # Core names map directly to directories below
                  # emulators/libretro/cores. Reject traversal/path separators.
                  if [[ ! "$CORE_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || \
                     [[ "$CORE_NAME" == "." ]] || \
                     [[ "$CORE_NAME" == ".." ]]; then
                      echo "coinops-libretro: invalid core name: $CORE_NAME" >&2
                      exit 2
                  fi

                  # Production launches inherit RETROFE_PATH from coinops-launcher.
                  # COINOPS_ROOT is retained as a manual diagnostic fallback.
                  COINOPS_ROOT="${RETROFE_PATH:-${COINOPS_ROOT:-}}"

                  if [[ -z "$COINOPS_ROOT" ]]; then
                      echo "coinops-libretro: RETROFE_PATH is not set" >&2
                      echo "Set RETROFE_PATH (or COINOPS_ROOT for manual testing) to the CoinOPS data root." >&2
                      exit 1
                  fi

                  if ! COINOPS_ROOT="$(cd "$COINOPS_ROOT" 2>/dev/null && pwd -P)"; then
                      echo "coinops-libretro: CoinOPS root does not exist" >&2
                      exit 1
                  fi

                  LIBRETRO_ROOT="$COINOPS_ROOT/emulators/libretro"
                  CORE_ROOT="$LIBRETRO_ROOT/cores/$CORE_NAME"

                  GLOBAL_CFG="$LIBRETRO_ROOT/retroarch.cfg"
                  CORE_CFG="$CORE_ROOT/core.cfg"
                  CORE_OPTIONS="$CORE_ROOT/core-options.cfg"
                  RUNTIME_CFG="$CORE_ROOT/.coinops-runtime.cfg"

                  [[ -f "$GLOBAL_CFG" ]] || {
                      echo "coinops-libretro: shared config missing: $GLOBAL_CFG" >&2
                      echo "Install/extract the CoinOPS-Libretro base payload first." >&2
                      exit 1
                  }

                  [[ -d "$CORE_ROOT" ]] || {
                      echo "coinops-libretro: core package not found: $CORE_ROOT" >&2
                      exit 1
                  }

                  [[ -f "$CORE_CFG" ]] || {
                      echo "coinops-libretro: required core config missing: $CORE_CFG" >&2
                      exit 1
                  }

                  [[ -f "$CORE_OPTIONS" ]] || {
                      echo "coinops-libretro: required core options missing: $CORE_OPTIONS" >&2
                      exit 1
                  }

                  # These paths are always launcher-managed so core packages
                  # remain portable with the complete CoinOPS tree.
                  if grep -Eq \
                    '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' \
                    "$CORE_CFG"
                  then
                      echo "coinops-libretro: core.cfg contains launcher-managed path settings:" >&2
                      grep -En \
                        '^[[:space:]]*(system_directory|savefile_directory|savestate_directory|core_options_path|input_remapping_directory)[[:space:]]*=' \
                        "$CORE_CFG" \
                        >&2 \
                        || true
                      exit 1
                  fi

                  mapfile -t CORE_LIBS < <(
                      find "$CORE_ROOT" \
                        -maxdepth 1 \
                        -type f \
                        -name '*_libretro.so' \
                        -print \
                        | sort
                  )

                  if [[ ${#CORE_LIBS[@]} -ne 1 ]]; then
                      echo "coinops-libretro: expected exactly one *_libretro.so in $CORE_ROOT; found ${#CORE_LIBS[@]}" >&2
                      printf '  %s\n' "${CORE_LIBS[@]:-}" >&2
                      exit 1
                  fi

                  CORE_LIBRARY="${CORE_LIBS[0]}"

                  # Empty directories can disappear when packages are archived.
                  mkdir -p \
                      "$CORE_ROOT/system" \
                      "$CORE_ROOT/saves" \
                      "$CORE_ROOT/states" \
                      "$CORE_ROOT/remaps" \
                      "$LIBRETRO_ROOT/autoconfig" \
                      "$LIBRETRO_ROOT/shaders" \
                      "$LIBRETRO_ROOT/overlays"

                  # Generate absolute runtime paths on every launch. This file is
                  # disposable and makes the entire CoinOPS data tree relocatable.
                  RUNTIME_TMP="${RUNTIME_CFG}.tmp.$$"
                  trap 'rm -f "$RUNTIME_TMP"' EXIT

                  {
                      cat "$CORE_CFG"

                      cat <<CFG

                  # ------------------------------------------------------------------
                  # Generated by coinops-libretro. Do not edit; rewritten every launch.
                  # ------------------------------------------------------------------
                  global_core_options = "true"
                  system_directory = "$CORE_ROOT/system"
                  savefile_directory = "$CORE_ROOT/saves"
                  savestate_directory = "$CORE_ROOT/states"
                  core_options_path = "$CORE_OPTIONS"
                  input_remapping_directory = "$CORE_ROOT/remaps"
                  joypad_autoconfig_dir = "$LIBRETRO_ROOT/autoconfig"
                  video_shader_dir = "$LIBRETRO_ROOT/shaders"
                  overlay_directory = "$LIBRETRO_ROOT/overlays"
                  CFG
                  } > "$RUNTIME_TMP"

                  mv -f "$RUNTIME_TMP" "$RUNTIME_CFG"
                  trap - EXIT

                  # Do not cd into the core directory. RetroFE may supply content
                  # paths relative to the CoinOPS root; all managed emulator paths
                  # above are absolute.
                  exec /app/bin/coinops-retroarch \
                      --config "$GLOBAL_CFG" \
                      --appendconfig "$RUNTIME_CFG" \
                      -L "$CORE_LIBRARY" \
                      "$@"
                  COINOPS_LIBRETRO_SCRIPT

                  chmod 0755 /app/bin/coinops-libretro

            # ======================================================
            # Final runtime cleanup
            #
            # At this point MAME, RetroFE and RetroArch are fully built.
            #
            # Remove development/debug/build-only files that are not
            # required by the installed runtime.
            # ======================================================
            - name: runtime-cleanup
              buildsystem: simple
              build-commands:
                - |
                  echo "============================================================"
                  echo "Cleaning final runtime payload"
                  echo "============================================================"
                # Development headers.
                - rm -rf /app/include
                # Debug symbols and copied source trees.
                - rm -rf /app/lib/debug
                # Build-system metadata.
                - rm -rf /app/lib/cmake
                - rm -rf /app/lib/pkgconfig
                # Documentation/man pages from helper utilities.
                - rm -rf /app/share/man
                # Static and libtool archives.
                - |
                  find /app \
                    -type f \
                    \( -name '*.a' -o -name '*.la' \) \
                    -delete
                # Remove unversioned linker-only .so symlinks.
                #
                # Keep runtime SONAME links such as:
                #
                #   libfoo.so.0
                #   libfoo.so.1
                #
                # Executables load those at runtime.
                - |
                  find /app/lib \
                    -maxdepth 1 \
                    -type l \
                    -name '*.so' \
                    -delete
                - |
                  echo
                  echo "============================================================"
                  echo "Remaining /app/lib contents"
                  echo "============================================================"
                  find /app/lib \
                    -maxdepth 2 \
                    \( -type f -o -type l \) \
                    -print \
                    | sort \
                    || true
            # ======================================================
            # CoinOPS launcher + desktop metadata
            # ======================================================
            - name: coinops-runtime
              buildsystem: simple
              build-commands:
                - install -Dm755 coinops-launcher /app/bin/coinops-launcher
                - install -Dm644 coinops-runtime.desktop /app/share/applications/org.coinops.Runtime.desktop
                - install -Dm644 coinops-runtime.png /app/share/icons/hicolor/256x256/apps/org.coinops.Runtime.png
              sources:
                - type: file
                  path: Packaging/Flatpak/coinops-launcher
                - type: file
                  path: Packaging/Flatpak/coinops-runtime.desktop
                - type: file
                  path: Packaging/Flatpak/coinops-runtime.png
          EOF
      # ============================================================
      # Inspect persistent local builder state
      #
      # No actions/cache step is needed on the normal self-hosted
      # runner because .flatpak-builder remains on local storage.
      # ============================================================

      - name: Inspect persistent build cache
        run: |
          echo "============================================================"
          echo "PERSISTENT FLATPAK-BUILDER STATE"
          echo "============================================================"
          if [ -d .flatpak-builder ]; then
            du -sh .flatpak-builder || true
            echo
            echo "Top-level cache contents:"
            du \
              -h \
              --max-depth=1 \
              .flatpak-builder \
              2>/dev/null \
              | sort -h \
              || true
          else
            echo "No existing .flatpak-builder cache."
            echo "This appears to be the first local build."
          fi
      # ============================================================
      # Build native Flatpak
      #
      # build-dir and repo are disposable.
      #
      # .flatpak-builder is deliberately preserved.
      # ============================================================

      - name: Build native CoinOPS Flatpak
        run: |
          rm -rf build-dir repo
          echo "============================================================"
          echo "Starting native Flatpak build"
          echo "============================================================"
          flatpak-builder \
            --user \
            --force-clean \
            --ccache \
            --keep-build-dirs \
            --repo=repo \
            --install-deps-from=flathub \
            build-dir \
            org.coinops.Runtime.yml
      # ============================================================
      # Analyze resulting Flatpak
      # ============================================================

      - name: Analyze native Flatpak
        run: |
          echo "============================================================"
          echo "TOTAL /APP PAYLOAD"
          echo "============================================================"
          du -sh build-dir/files
          echo
          echo "============================================================"
          echo "/APP/BIN"
          echo "============================================================"
          ls -lh build-dir/files/bin
          echo
          echo "============================================================"
          echo "RETROFE"
          echo "============================================================"
          file build-dir/files/bin/retrofe
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/retrofe || true
          echo
          echo "============================================================"
          echo "MAME"
          echo "============================================================"
          file build-dir/files/bin/mame
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/mame || true
          echo
          echo "============================================================"
          echo "HYPSEUS SINGE"
          echo "============================================================"
          test -x build-dir/files/bin/hypseus
          file build-dir/files/bin/hypseus
          echo
          echo "Dynamic dependencies:"
          if ! ldd build-dir/files/bin/hypseus \
            | tee /tmp/coinops-hypseus-ldd.txt
          then
            echo "Unable to inspect Hypseus dynamic dependencies" >&2
            exit 1
          fi
          if grep -q 'not found' /tmp/coinops-hypseus-ldd.txt; then
            echo "Hypseus has unresolved dynamic dependencies" >&2
            exit 1
          fi
          echo
          echo "============================================================"
          echo "COINOPS RETROARCH RUNTIME"
          echo "============================================================"
          file build-dir/files/bin/coinops-retroarch
          echo
          echo "Dynamic dependencies:"
          ldd build-dir/files/bin/coinops-retroarch || true
          echo
          echo "============================================================"
          echo "BUNDLED /APP/LIB"
          echo "============================================================"
          if [ -d build-dir/files/lib ]; then
            find build-dir/files/lib \
              -maxdepth 3 \
              \( -type f -o -type l \) \
              -printf '%p\n' \
              | sort
            echo
            du \
              -h \
              -d 3 \
              build-dir/files/lib \
              2>/dev/null \
              | sort -h \
              | tail -100
          fi
          echo
          echo "============================================================"
          echo "BUILD-ONLY FILE CHECK"
          echo "============================================================"
          for path in \
            build-dir/files/include \
            build-dir/files/lib/debug \
            build-dir/files/lib/cmake \
            build-dir/files/lib/pkgconfig \
            build-dir/files/share/man
          do
            if [ -e "$path" ]; then
              echo "[LEFTOVER] $path"
            else
              echo "[CLEAN] $path"
            fi
          done
          echo
          echo "============================================================"
          echo "50 LARGEST FILES IN /APP"
          echo "============================================================"
          find build-dir/files \
            -type f \
            -printf '%s %p\n' \
            | sort -nr \
            | head -50 \
            | numfmt \
                --field=1 \
                --to=iec \
            || true
          echo
          echo "============================================================"
          echo "REPOSITORY SIZE"
          echo "============================================================"
          du -sh repo
          echo
          echo "============================================================"
          echo "PERSISTENT BUILDER CACHE SIZE"
          echo "============================================================"
          du -sh .flatpak-builder || true
      # ============================================================
      # Smoke tests
      # ============================================================

      - name: Smoke test native Flatpak
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Host AppImage launch bridge"
          echo "============================================================"
          # flatpak-builder --run applies the final app permissions (except
          # filesystem permissions), so this verifies both that flatpak-spawn
          # is available and that org.freedesktop.Flatpak D-Bus access works.
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            flatpak-spawn \
            --host \
            --watch-bus \
            --directory=/tmp \
            /usr/bin/true
          echo "flatpak-spawn host bridge: OK"
          echo
          echo "============================================================"
          echo "RetroFE version"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/retrofe \
            --version \
            || true
          echo
          echo "============================================================"
          echo "MAME version"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/mame \
            -version
          echo
          echo "Stripped RetroArch version + features"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/coinops-retroarch \
            --version
          echo
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            /app/bin/coinops-retroarch \
            --features
          echo
          echo "============================================================"
          echo "PATH resolution"
          echo "============================================================"
          flatpak-builder \
            --run \
            build-dir \
            org.coinops.Runtime.yml \
            sh \
            -c '
              echo "$PATH"
              echo
              echo "retrofe:"
              command -v retrofe
              echo
              echo "mame:"
              command -v mame
              echo
              echo "hypseus:"
              command -v hypseus
              echo
              echo "coinops-retroarch:"
              command -v coinops-retroarch
              echo "coinops-libretro:"
              command -v coinops-libretro
              echo
              echo "coinops-launcher:"
              command -v coinops-launcher
            '
      # ============================================================
      # Build distributable Flatpak bundle
      # ============================================================

      - name: Build Flatpak bundle
        run: |
          echo "Creating native Flatpak bundle..."
          (
            while true; do
              echo "Still building Flatpak bundle: $(date)"
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap \
            'kill "$HEARTBEAT_PID" 2>/dev/null || true' \
            EXIT
          flatpak build-bundle \
            repo \
            CoinOPS-Runtime-Native-x86_64.flatpak \
            org.coinops.Runtime \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          echo
          echo "Bundle complete:"
          ls -lh CoinOPS-Runtime-Native-x86_64.flatpak
          echo
          echo "Bundle byte size:"
          stat \
            --printf='%s bytes\n' \
            CoinOPS-Runtime-Native-x86_64.flatpak
      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload native CoinOPS Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: CoinOPS-Runtime-Native-x86_64.flatpak
          path: CoinOPS-Runtime-Native-x86_64.flatpak
          if-no-files-found: error
