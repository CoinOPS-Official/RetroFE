name: macOS Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake pkg-config gstreamer glib libusb libserialport curl zlib
      - name: Configure
        run: cmake -S RetroFE/Source -B RetroFE/Build -DCMAKE_BUILD_TYPE=Release -DRETROFE_BUILD_TESTING=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build RetroFE/Build --parallel 3
      - name: Test
        run: ctest --test-dir RetroFE/Build --output-on-failure
      # This is a host-architecture development binary, not a standalone app bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: RetroFE-macos-development-binary
          path: RetroFE/Build/bin/retrofe
