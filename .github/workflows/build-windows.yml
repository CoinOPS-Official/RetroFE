name: Windows Package
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build Windows

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GStreamer
        run: |
          choco install -y gstreamer --version 1.24.11
          choco install -y gstreamer-devel --version 1.24.11

      - name: Build and test SDL3 RetroFE
        shell: pwsh
        run: ./RetroFE/Source/Build.ps1 -GStreamerRoot 'D:/gstreamer/1.0/msvc_x86_64'

      # Runtime-only artifact; frontend settings, layouts and media are supplied
      # by the installation. Do not mix the historical SDL2 dependency bundle in.
      - name: Upload SDL3 runtime
        uses: actions/upload-artifact@v4
        with:
          name: RetroFE-windows-SDL3-runtime
          path: |
            RetroFE/Build/bin/Release/**
            !RetroFE/Build/bin/Release/*tests.exe
