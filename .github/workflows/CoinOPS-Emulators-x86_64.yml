            "$CORE_ROOT/saves/.keep" \
            "$CORE_ROOT/states/.keep" \
            "$CORE_ROOT/remaps/.keep"

          cat > "$CORE_ROOT/system/PPSSPP/README-COINOPS.txt" <<'EOF_ASSETS'
          PPSSPP libretro system assets

          This directory contains the runtime subset used by the libretro core:
          compat.ini, flash0, language files, and only the three PPSSPP-internal
          Vulkan texture shaders exposed through its core options. Standalone
          PPSSPP UI, debugger and post-processing assets are intentionally omitted.

          PPSSPP does not require a PSP BIOS. Save data and the emulated Memory
          Stick are written to the core's managed saves directory by the
          CoinOPS libretro launcher.
          EOF_ASSETS

          CORE_SHA256="$(sha256sum "$CORE_ROOT/ppsspp_libretro.so" | awk '{print $1}')"

          cat > "$CORE_ROOT/manifest.json" <<EOF_MANIFEST
          {
            "name": "PPSSPP",
            "package_name": "ppsspp",
            "type": "libretro-core",
            "platform": "linux-x86_64",
            "source_repository": "hrydgard/ppsspp",
            "source_commit": "c119d9b258289a4602691a6f97a8dc4091a94221",
            "upstream_base": "PPSSPP",
            "runtime_abi": "org.freedesktop.Platform/25.08",
            "core_path": "cores/ppsspp/ppsspp_libretro.so",
            "core_config": "cores/ppsspp/core.cfg",
            "core_options": "cores/ppsspp/core-options.cfg",
            "system_assets": "cores/ppsspp/system/PPSSPP",
            "sha256": "$CORE_SHA256"
          }
          EOF_MANIFEST

      - name: Validate packaged PPSSPP contract
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
