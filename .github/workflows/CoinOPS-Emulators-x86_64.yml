                "$GITHUB_WORKSPACE/CoinOPS-Emulators-x86_64/emulators/libretro/cores/ppsspp"
              PPSSPP_SYSTEM="$GITHUB_WORKSPACE/CoinOPS-Emulators-x86_64/emulators/libretro/cores/ppsspp/system/PPSSPP"
              test -f "$PPSSPP_SYSTEM/compat.ini"
              test -d "$PPSSPP_SYSTEM/flash0"
