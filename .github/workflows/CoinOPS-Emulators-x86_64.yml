            "$CORE_ROOT/system/PPSSPP" \
            "$CORE_ROOT/saves" \
            "$CORE_ROOT/states" \
            "$CORE_ROOT/remaps"

          cp \
            PPSSPPCore/build-libretro/lib/ppsspp_libretro.so \
            "$CORE_ROOT/ppsspp_libretro.so"

          cp \
            CoinOPSRepo/Packaging/Emulators/libretro/cores/ppsspp/core.cfg \
            "$CORE_ROOT/core.cfg"

          cp ppsspp-core-options.cfg "$CORE_ROOT/core-options.cfg"
          cp PPSSPPCore/LICENSE.TXT "$CORE_ROOT/LICENSE.txt"

          # The libretro core uses system/PPSSPP as its asset root, but the
          # full upstream assets tree also contains standalone UI/debugger
          # resources. Package only the runtime data used by the core.
          PPSSPP_SYSTEM="$CORE_ROOT/system/PPSSPP"

          cp \
            PPSSPPCore/assets/compat.ini \
            "$PPSSPP_SYSTEM/compat.ini"

          cp -a \
            PPSSPPCore/assets/flash0 \
            PPSSPPCore/assets/lang \
            "$PPSSPP_SYSTEM/"

          # The libretro core exposes only three PPSSPP-internal Vulkan
          # texture shaders. Do not package the standalone application's
          # post-processing shader collection.
          mkdir -p "$PPSSPP_SYSTEM/shaders"
          cp \
            PPSSPPCore/assets/shaders/defaultshaders.ini \
            PPSSPPCore/assets/shaders/tex_2xbrz.csh \
            PPSSPPCore/assets/shaders/tex_4xbrz.csh \
            PPSSPPCore/assets/shaders/tex_mmpx.csh \
            "$PPSSPP_SYSTEM/shaders/"

          test -f "$PPSSPP_SYSTEM/compat.ini"
          test -d "$PPSSPP_SYSTEM/flash0"
          test -d "$PPSSPP_SYSTEM/lang"
          test -f "$PPSSPP_SYSTEM/shaders/defaultshaders.ini"
          test -f "$PPSSPP_SYSTEM/shaders/tex_2xbrz.csh"
          test -f "$PPSSPP_SYSTEM/shaders/tex_4xbrz.csh"
          test -f "$PPSSPP_SYSTEM/shaders/tex_mmpx.csh"
          test "$(find "$PPSSPP_SYSTEM/shaders" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4

