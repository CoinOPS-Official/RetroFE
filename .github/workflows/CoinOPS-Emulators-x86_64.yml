                -DUSE_SYSTEM_SNAPPY=OFF \
                -DUSE_SYSTEM_FREETYPE=OFF \
                -DUSE_SYSTEM_LIBCHDR=OFF \
                -DUSE_SYSTEM_LIBZIP=OFF \
                -DUSE_SYSTEM_RAPIDJSON=OFF \
                -DUSE_SYSTEM_ZSTD=OFF \
                -DUSE_SYSTEM_MINIUPNPC=OFF

              cmake \
                --build build-libretro \
                --target ppsspp_libretro \
                --parallel 10

              test -f build-libretro/lib/ppsspp_libretro.so
              strip --strip-unneeded build-libretro/lib/ppsspp_libretro.so
            '

          ls -lh PPSSPPCore/build-libretro/lib/ppsspp_libretro.so
          sha256sum PPSSPPCore/build-libretro/lib/ppsspp_libretro.so

      - name: Validate PPSSPP ABI and dependencies
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              CORE="$GITHUB_WORKSPACE/PPSSPPCore/build-libretro/lib/ppsspp_libretro.so"

              echo "============================================================"
              echo "ELF dependencies"
              echo "============================================================"
              ldd "$CORE"
              if ldd "$CORE" | grep -q "not found"; then
                echo "ERROR: unresolved PPSSPP dependency"
                exit 1
              fi

              echo
              echo "============================================================"
              echo "Required libretro exports"
              echo "============================================================"
              for symbol in \
                retro_api_version \
                retro_init \
                retro_deinit \
                retro_load_game \
                retro_unload_game \
                retro_run
              do
                nm -D "$CORE" | grep -Eq "[[:space:]]${symbol}$" || {
                  echo "ERROR: missing export: $symbol"
                  exit 1
                }
                echo "found: $symbol"
              done

              echo
              echo "============================================================"
              echo "dlopen smoke test"
              echo "============================================================"
              python3 -c "import ctypes, os, sys; core=sys.argv[1]; lib=ctypes.CDLL(core, mode=os.RTLD_NOW | os.RTLD_LOCAL); lib.retro_api_version.restype=ctypes.c_uint; print(\"Loaded %s; libretro API version %u\" % (core, lib.retro_api_version()))" "$CORE"
            '

      - name: Generate PPSSPP core options from exact binary
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              cc \
                -O2 \
                -o "$GITHUB_WORKSPACE/dump-core-options" \
                "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/dump-core-options.c" \
                -ldl

              "$GITHUB_WORKSPACE/dump-core-options" \
                "$GITHUB_WORKSPACE/PPSSPPCore/build-libretro/lib/ppsspp_libretro.so" \
                > "$GITHUB_WORKSPACE/ppsspp-generated-options.txt" \
                2> "$GITHUB_WORKSPACE/ppsspp-option-values.txt"
            '

          python3 - <<'PY'
          from pathlib import Path

          source = Path("ppsspp-generated-options.txt")
          output = Path("ppsspp-core-options.cfg")

          options = []
          for raw in source.read_text().splitlines():
              if "=" not in raw:
                  continue
              key, value = raw.split("=", 1)
              key = key.strip()
              value = value.strip()
              if not key or not value:
                  continue

              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              options.append((key, escaped))

          if len(options) < 40:
              raise SystemExit(
                  f"ERROR: PPSSPP registered only {len(options)} non-empty options"
              )

          with output.open("w", encoding="utf-8") as f:
              f.write("# CoinOPS PPSSPP core options\n")
              f.write("# Generated from the exact pinned PPSSPP binary.\n\n")
              for key, value in options:
                  f.write(f'{key} = "{value}"\n')

          print(f"Generated PPSSPP options: {len(options)}")
          PY

          sed -n '1,40p' ppsspp-core-options.cfg

      - name: Package PPSSPP
