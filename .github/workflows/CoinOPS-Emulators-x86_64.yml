            "$CORE_ROOT/core.cfg"

          cp mupen64plus-next-core-options.cfg "$CORE_ROOT/core-options.cfg"
          cp Mupen64PlusNextCore/LICENSE "$CORE_ROOT/LICENSE.txt"

          # No upstream runtime assets are copied.
          # The current source embeds both mupen64plus.ini and
          # GLideN64.custom.ini. The empty Mupen64plus directory is retained
          # solely as the core-managed writable root for runtime caches and
          # optional user-provided texture packs.
          test -z "$(find "$CORE_ROOT/system/Mupen64plus" -mindepth 1 -print -quit)"

          touch \
            "$CORE_ROOT/saves/.keep" \
            "$CORE_ROOT/states/.keep" \
            "$CORE_ROOT/remaps/.keep"

          CORE_SHA256="$(sha256sum "$CORE_ROOT/mupen64plus_next_libretro.so" | awk '{print $1}')"

          cat > "$CORE_ROOT/manifest.json" <<EOF_MANIFEST
          {
            "name": "Mupen64Plus-Next",
            "package_name": "mupen64plus-next",
            "type": "libretro-core",
            "platform": "linux-x86_64",
            "source_repository": "libretro/mupen64plus-libretro-nx",
            "source_commit": "98c1b0d877542b01314b3b04272282ba223b65b3",
            "upstream_base": "Mupen64Plus",
            "runtime_abi": "org.freedesktop.Platform/25.08",
            "core_path": "cores/mupen64plus-next/mupen64plus_next_libretro.so",
            "core_config": "cores/mupen64plus-next/core.cfg",
            "core_options": "cores/mupen64plus-next/core-options.cfg",
            "system_root": "cores/mupen64plus-next/system/Mupen64plus",
            "sha256": "$CORE_SHA256"
          }
          EOF_MANIFEST

      - name: Validate packaged Mupen64Plus-Next contract
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              CORE_ROOT="$GITHUB_WORKSPACE/CoinOPS-Emulators-x86_64/emulators/libretro/cores/mupen64plus-next"

              bash "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/validate-libretro-core.sh" \
                "$CORE_ROOT"

              test -d "$CORE_ROOT/system/Mupen64plus"
              test -z "$(find "$CORE_ROOT/system/Mupen64plus" -mindepth 1 -print -quit)"
            '

      # ============================================================
      # Future emulators go here
      #
      # Add each core/standalone into CoinOPS-Emulators-x86_64/emulators/.
      # Do not create a new user-facing package for every emulator unless
      # there is a concrete reason to do so.
      # ============================================================

      - name: Finalize internal emulator bundle
        run: |
          set -euo pipefail

          cp \
            CoinOPSRepo/Packaging/Emulators/PACKAGE-CONTRACT.txt \
            CoinOPS-Emulators-x86_64/PACKAGE-CONTRACT.txt

          cat > CoinOPS-Emulators-x86_64/README.txt <<'EOF'
          CoinOPS emulator staging bundle - Linux x86_64

          This is an internal superset bundle, not a required end-user package.

          Workflow:
            1. Extract into the CoinOPS data tree.
            2. Delete emulator/core directories not needed by that build.
            3. Ship what remains with the CoinOPS build.

          MAME is intentionally NOT included here. MAME is mandatory for every
          CoinOPS build and is part of org.coinops.Runtime.

          Current contents:
            - Shared libretro RetroArch configuration
            - RetroArch Linux joypad autoconfig profiles (UDEV + SDL2)
            - Flycast libretro core
            - LRPS2 PlayStation 2 libretro core
            - PPSSPP PlayStation Portable libretro core
            - SwanStation PlayStation libretro core
            - Mupen64Plus-Next Nintendo 64 libretro core

          Future optional libretro cores and standalone emulators are added to
          this same staging bundle.
          EOF

          echo "============================================================"
          echo "Emulator staging tree"
          echo "============================================================"
          find CoinOPS-Emulators-x86_64 -maxdepth 8 -printf '%p\n' | sort
          echo
          du -sh CoinOPS-Emulators-x86_64

      - name: Build emulator tarball
        run: |
          set -euo pipefail

          rm -f CoinOPS-Emulators-x86_64.tar.zst

          tar \
            --zstd \
            -cf CoinOPS-Emulators-x86_64.tar.zst \
            -C CoinOPS-Emulators-x86_64 \
            .

          echo "============================================================"
          echo "Bundle"
          echo "============================================================"
          ls -lh CoinOPS-Emulators-x86_64.tar.zst
          sha256sum CoinOPS-Emulators-x86_64.tar.zst

      - name: Upload internal emulator bundle
        uses: actions/upload-artifact@v7
        with:
          name: CoinOPS-Emulators-x86_64
          path: CoinOPS-Emulators-x86_64.tar.zst
          if-no-files-found: error
          compression-level: 0
