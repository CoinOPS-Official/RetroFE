name: CoinOPS Emulators - Linux x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64

    name: Build CoinOPS Emulator Bundle x86_64

    steps:
      # ============================================================
      # Current CoinOPS repository
      #
      # This contains the curated shared RetroArch config, per-core
      # configs/options, package contract and common validation tools.
      # ============================================================

      - name: Checkout current CoinOPS repository
        uses: actions/checkout@v6
        with:
          path: CoinOPSRepo
          clean: true

      # ============================================================
      # RetroArch joypad autoconfiguration database
      #
      # These profiles map physical controllers to the RetroPad virtual
      # controller. Only Linux-relevant UDEV and SDL2 profiles are shipped.
      # ============================================================

      - name: Checkout RetroArch joypad autoconfig database
        uses: actions/checkout@v6
        with:
          repository: libretro/retroarch-joypad-autoconfig
          ref: 7a44e4aa65f1c5380867e9088d8764d585341aa4
          path: RetroArchJoypadAutoconfig
          clean: true
          fetch-depth: 1

      # ============================================================
      # Host / SDK setup
      # ============================================================

      - name: Verify host tools
        run: |
          set -euo pipefail
          git --version
          flatpak --version
          cmake --version
          tar --version | head -1
          command -v zstd >/dev/null || {
            echo "ERROR: zstd is required on the self-hosted runner."
            echo "Install with: sudo pacman -S --needed zstd"
            exit 1
          }
          zstd --version

      - name: Configure Flathub
        run: |
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Freedesktop 25.08 SDK
        run: |
          flatpak install \
            --user \
            --noninteractive \
            flathub \
            org.freedesktop.Sdk//25.08

      # ============================================================
      # Build staging bundle
      #
      # Future libretro cores and standalone emulators are added to
      # this same bundle. It is an internal superset: extract, delete
      # emulator folders not needed by a CoinOPS build, then ship.
      # ============================================================

      - name: Create emulator bundle staging tree
        run: |
          set -euo pipefail

          rm -rf CoinOPS-Emulators-x86_64

          mkdir -p \
            CoinOPS-Emulators-x86_64/emulators/libretro/autoconfig \
            CoinOPS-Emulators-x86_64/emulators/libretro/shaders \
            CoinOPS-Emulators-x86_64/emulators/libretro/overlays \
            CoinOPS-Emulators-x86_64/emulators/libretro/cores

          cp \
            CoinOPSRepo/Packaging/Emulators/libretro/retroarch.cfg \
            CoinOPS-Emulators-x86_64/emulators/libretro/retroarch.cfg

          RETROARCH_CFG="CoinOPS-Emulators-x86_64/emulators/libretro/retroarch.cfg"

          # Controller autoconfiguration is part of the CoinOPS headless runtime.
          # Normalize this in the staged config so the packaged profile database
          # is always active, regardless of RetroArch's compiled/default setting.
          if grep -Eq '^[[:space:]]*input_autodetect_enable[[:space:]]*=' "$RETROARCH_CFG"; then
            sed -i -E \
              's|^[[:space:]]*input_autodetect_enable[[:space:]]*=.*$|input_autodetect_enable = "true"|' \
              "$RETROARCH_CFG"
          else
            printf '\ninput_autodetect_enable = "true"\n' >> "$RETROARCH_CFG"
          fi

          # global_core_options is intentionally NOT a shared-config policy.
          # coinops-libretro enables it only in its generated per-launch config
          # so core_options_path can point at cores/<core>/core-options.cfg.
          if grep -Eq '^[[:space:]]*global_core_options[[:space:]]*=[[:space:]]*"true"' "$RETROARCH_CFG"; then
            echo 'ERROR: remove global_core_options = "true" from shared retroarch.cfg.'
            echo 'It belongs only in the Runtime-generated .coinops-runtime.cfg.'
            exit 1
          fi

          touch \
            CoinOPS-Emulators-x86_64/emulators/libretro/shaders/.keep \
            CoinOPS-Emulators-x86_64/emulators/libretro/overlays/.keep

      - name: Package RetroArch joypad autoconfig profiles
        run: |
          set -euo pipefail

          AUTOCONFIG_ROOT="CoinOPS-Emulators-x86_64/emulators/libretro/autoconfig"

          rm -rf \
            "$AUTOCONFIG_ROOT/udev" \
            "$AUTOCONFIG_ROOT/sdl2"

          cp -a \
            RetroArchJoypadAutoconfig/udev \
            "$AUTOCONFIG_ROOT/udev"

          cp -a \
            RetroArchJoypadAutoconfig/sdl2 \
            "$AUTOCONFIG_ROOT/sdl2"

          cp \
            RetroArchJoypadAutoconfig/COPYING \
            "$AUTOCONFIG_ROOT/COPYING"

          test -d "$AUTOCONFIG_ROOT/udev"
          test -d "$AUTOCONFIG_ROOT/sdl2"
          test -f "$AUTOCONFIG_ROOT/COPYING"
          test -n "$(find "$AUTOCONFIG_ROOT/udev" -type f -name '*.cfg' -print -quit)"
          test -n "$(find "$AUTOCONFIG_ROOT/sdl2" -type f -name '*.cfg' -print -quit)"

          echo "============================================================"
          echo "RetroArch joypad autoconfig profiles"
          echo "============================================================"
          printf 'udev: '
          find "$AUTOCONFIG_ROOT/udev" -type f -name '*.cfg' | wc -l
          printf 'sdl2: '
          find "$AUTOCONFIG_ROOT/sdl2" -type f -name '*.cfg' | wc -l

      # ============================================================
      # Flycast reference core
      # ============================================================

      - name: Checkout CoinOPS Flycast source
        uses: actions/checkout@v6
        with:
          repository: CoinOPS-Official/flycast
          ref: e7426bb864157a4c45866d6253bd24ae89f7d046
          path: FlycastCore
          clean: true
          fetch-depth: 1
          submodules: recursive

      - name: Show Flycast revision
        run: |
          echo "============================================================"
          echo "Flycast source"
          echo "============================================================"
          git -C FlycastCore rev-parse HEAD
          git -C FlycastCore describe --tags --always || true

      - name: Build Flycast libretro core
        run: |
          set -euo pipefail

          rm -rf FlycastCore/build-libretro

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              cd "$GITHUB_WORKSPACE/FlycastCore"

              cmake \
                -S . \
                -B build-libretro \
                -DCMAKE_BUILD_TYPE=Release \
                -DLIBRETRO=ON \
                -DUSE_VULKAN=ON \
                -DUSE_OPENGL=ON \
                -DUSE_OPENMP=ON \
                -DUSE_HOST_GLSLANG=OFF \
                -DUSE_HOST_LIBZIP=OFF \
                -DUSE_HOST_LIBCHDR=OFF \
                -DUSE_BREAKPAD=OFF \
                -DUSE_LUA=OFF \
                -DUSE_LIBCDIO=OFF \
                -DENABLE_CTEST=OFF

              cmake --build build-libretro --parallel 10

              test -f build-libretro/flycast_libretro.so
              strip --strip-unneeded build-libretro/flycast_libretro.so
            '

          ls -lh FlycastCore/build-libretro/flycast_libretro.so
          sha256sum FlycastCore/build-libretro/flycast_libretro.so

      - name: Validate Flycast ABI and dependencies
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              CORE="$GITHUB_WORKSPACE/FlycastCore/build-libretro/flycast_libretro.so"

              echo "============================================================"
              echo "ELF dependencies"
              echo "============================================================"
              ldd "$CORE"
              if ldd "$CORE" | grep -q "not found"; then
                echo "ERROR: unresolved Flycast dependency"
                exit 1
              fi

              echo
              echo "============================================================"
              echo "Required libretro exports"
              echo "============================================================"
              for symbol in \
                retro_api_version \
                retro_init \
                retro_deinit \
                retro_load_game \
                retro_unload_game \
                retro_run
              do
                nm -D "$CORE" | grep -Eq "[[:space:]]${symbol}$" || {
                  echo "ERROR: missing export: $symbol"
                  exit 1
                }
                echo "found: $symbol"
              done

              echo
              echo "============================================================"
              echo "dlopen smoke test"
              echo "============================================================"
              python3 -c "import ctypes, os, sys; core=sys.argv[1]; lib=ctypes.CDLL(core, mode=os.RTLD_NOW | os.RTLD_LOCAL); lib.retro_api_version.restype=ctypes.c_uint; print(\"Loaded %s; libretro API version %u\" % (core, lib.retro_api_version()))" "$CORE"
            '

      # ============================================================
      # Verify checked-in Flycast core options against exact binary
      # ============================================================

      - name: Verify Flycast core options are current
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              cc \
                -O2 \
                -o "$GITHUB_WORKSPACE/dump-core-options" \
                "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/dump-core-options.c" \
                -ldl

              "$GITHUB_WORKSPACE/dump-core-options" \
                "$GITHUB_WORKSPACE/FlycastCore/build-libretro/flycast_libretro.so" \
                > "$GITHUB_WORKSPACE/flycast-generated-options.txt" \
                2> "$GITHUB_WORKSPACE/flycast-option-values.txt"
            '

          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg = Path("CoinOPSRepo/Packaging/Emulators/libretro/cores/flycast/core-options.cfg")
          out = Path("flycast-checked-options.txt")

          values = []
          pattern = re.compile(r'^\s*([A-Za-z0-9_-]+)\s*=\s*"(.*)"\s*$')
          for line in cfg.read_text().splitlines():
              m = pattern.match(line)
              if m:
                  values.append(f"{m.group(1)}={m.group(2)}")

          out.write_text("\n".join(sorted(values)) + "\n")
          print(f"Checked-in options: {len(values)}")
          PY

          sort flycast-generated-options.txt > flycast-generated-options.sorted.txt

          echo "Generated options: $(wc -l < flycast-generated-options.sorted.txt)"

          if ! diff -u \
            flycast-checked-options.txt \
            flycast-generated-options.sorted.txt
          then
            echo
            echo "ERROR: checked-in Flycast core-options.cfg no longer matches"
            echo "the exact option defaults registered by the pinned core."
            exit 1
          fi

          echo "Flycast core-options.cfg exactly matches the pinned core."

      # ============================================================
      # Package Flycast into the shared emulator staging tree
      # ============================================================

      - name: Package Flycast
        run: |
          set -euo pipefail

          CORE_ROOT="CoinOPS-Emulators-x86_64/emulators/libretro/cores/flycast"

          mkdir -p \
            "$CORE_ROOT/system/dc" \
            "$CORE_ROOT/saves" \
            "$CORE_ROOT/states" \
            "$CORE_ROOT/remaps"

          cp \
            FlycastCore/build-libretro/flycast_libretro.so \
            "$CORE_ROOT/flycast_libretro.so"

          cp \
            CoinOPSRepo/Packaging/Emulators/libretro/cores/flycast/core.cfg \
            "$CORE_ROOT/core.cfg"

          cp \
            CoinOPSRepo/Packaging/Emulators/libretro/cores/flycast/core-options.cfg \
            "$CORE_ROOT/core-options.cfg"

          cp FlycastCore/LICENSE "$CORE_ROOT/LICENSE.txt"

          touch \
            "$CORE_ROOT/saves/.keep" \
            "$CORE_ROOT/states/.keep" \
            "$CORE_ROOT/remaps/.keep"

          cat > "$CORE_ROOT/system/dc/README-BIOS.txt" <<'EOF'
          Flycast firmware / arcade BIOS directory

          Common filenames:
            dc_boot.bin   Dreamcast BIOS (optional; HLE BIOS is available)
            dc_flash.bin  Dreamcast flash
            naomi.zip     NAOMI BIOS
            naomi2.zip    NAOMI 2 BIOS
            awbios.zip    Atomiswave BIOS
            segasp.zip    Sega System SP BIOS

          BIOS files are not distributed with CoinOPS.

          Flycast also writes VMU/NVRAM-style system data below this managed
          system directory, so this directory must remain writable.
          EOF

          CORE_SHA256="$(sha256sum "$CORE_ROOT/flycast_libretro.so" | awk '{print $1}')"

          cat > "$CORE_ROOT/manifest.json" <<EOF
          {
            "name": "Flycast",
            "package_name": "flycast",
            "type": "libretro-core",
            "platform": "linux-x86_64",
            "source_repository": "CoinOPS-Official/flycast",
            "source_commit": "e7426bb864157a4c45866d6253bd24ae89f7d046",
            "upstream_base": "Flycast v2.6",
            "runtime_abi": "org.freedesktop.Platform/25.08",
            "core_path": "cores/flycast/flycast_libretro.so",
            "core_config": "cores/flycast/core.cfg",
            "core_options": "cores/flycast/core-options.cfg",
            "sha256": "$CORE_SHA256"
          }
          EOF

      - name: Validate packaged Flycast contract
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              bash "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/validate-libretro-core.sh" \
                "$GITHUB_WORKSPACE/CoinOPS-Emulators-x86_64/emulators/libretro/cores/flycast"
            '

      # ============================================================
      # LRPS2 - PlayStation 2 libretro core
      # ============================================================

      - name: Checkout LRPS2 source
        uses: actions/checkout@v6
        with:
          repository: libretro/ps2
          ref: 43129ad5ccbde21b022dd3b3fad1862f72a109bf
          path: LRPS2Core
          clean: true
          fetch-depth: 1
          submodules: recursive

      - name: Show LRPS2 revision
        run: |
          echo "============================================================"
          echo "LRPS2 source"
          echo "============================================================"
          git -C LRPS2Core rev-parse HEAD
          git -C LRPS2Core describe --tags --always || true

      - name: Build LRPS2 libretro core
        run: |
          set -euo pipefail

          rm -rf LRPS2Core/build-libretro

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              cd "$GITHUB_WORKSPACE/LRPS2Core"

              cmake \
                -S . \
                -B build-libretro \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DLIBRETRO=ON \
                -DUSE_OPENGL=ON \
                -DUSE_VULKAN=ON

              cmake \
                --build build-libretro \
                --target pcsx2_libretro \
                --parallel 10

              test -f build-libretro/bin/pcsx2_libretro.so
              strip --strip-unneeded build-libretro/bin/pcsx2_libretro.so
            '

          ls -lh LRPS2Core/build-libretro/bin/pcsx2_libretro.so
          sha256sum LRPS2Core/build-libretro/bin/pcsx2_libretro.so

      - name: Validate LRPS2 ABI and dependencies
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              CORE="$GITHUB_WORKSPACE/LRPS2Core/build-libretro/bin/pcsx2_libretro.so"

              echo "============================================================"
              echo "ELF dependencies"
              echo "============================================================"
              ldd "$CORE"
              if ldd "$CORE" | grep -q "not found"; then
                echo "ERROR: unresolved LRPS2 dependency"
                exit 1
              fi

              echo
              echo "============================================================"
              echo "Required libretro exports"
              echo "============================================================"
              for symbol in \
                retro_api_version \
                retro_init \
                retro_deinit \
                retro_load_game \
                retro_unload_game \
                retro_run
              do
                nm -D "$CORE" | grep -Eq "[[:space:]]${symbol}$" || {
                  echo "ERROR: missing export: $symbol"
                  exit 1
                }
                echo "found: $symbol"
              done

              echo
              echo "============================================================"
              echo "dlopen smoke test"
              echo "============================================================"
              python3 -c "import ctypes, os, sys; core=sys.argv[1]; lib=ctypes.CDLL(core, mode=os.RTLD_NOW | os.RTLD_LOCAL); lib.retro_api_version.restype=ctypes.c_uint; print(\"Loaded %s; libretro API version %u\" % (core, lib.retro_api_version()))" "$CORE"
            '

      - name: Generate LRPS2 core options from exact binary
        run: |
          set -euo pipefail

          rm -rf lrps2-options-system
          mkdir -p lrps2-options-system/pcsx2/bios

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env=COINOPS_CORE_OPTIONS_SYSTEM_DIR="$GITHUB_WORKSPACE/lrps2-options-system" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu

              cc \
                -O2 \
                -o "$GITHUB_WORKSPACE/dump-core-options" \
                "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/dump-core-options.c" \
                -ldl

              "$GITHUB_WORKSPACE/dump-core-options" \
                --init \
                "$GITHUB_WORKSPACE/LRPS2Core/build-libretro/bin/pcsx2_libretro.so" \
                > "$GITHUB_WORKSPACE/lrps2-generated-options.txt" \
                2> "$GITHUB_WORKSPACE/lrps2-option-values.txt"
            '

          python3 - <<'PY'
          from pathlib import Path

          source = Path("lrps2-generated-options.txt")
          output = Path("lrps2-core-options.cfg")

          options = []
          renderer_overridden = False
          for raw in source.read_text().splitlines():
              if "=" not in raw:
                  continue
              key, value = raw.split("=", 1)
              key = key.strip()
              value = value.strip()

              # pcsx2_bios is populated dynamically after LRPS2 scans
              # system/pcsx2/bios. With no BIOS in the CI fixture its default
              # is intentionally empty, so do not pin it in core-options.cfg.
              if not key or not value:
                  continue

              # CoinOPS Linux default: LRPS2 Auto selected OpenGL on Steam Deck
              # and produced a black game image. Explicit Vulkan was verified
              # working on the same hardware; Software (SW) also rendered.
              if key == "pcsx2_renderer":
                  value = "Vulkan"
                  renderer_overridden = True

              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              options.append((key, escaped))

          if not renderer_overridden:
              raise SystemExit("ERROR: LRPS2 did not register pcsx2_renderer")

          if len(options) < 20:
              raise SystemExit(
                  f"ERROR: LRPS2 registered only {len(options)} non-empty options"
              )

          with output.open("w", encoding="utf-8") as f:
              f.write("# CoinOPS LRPS2 core options\n")
              f.write("# Generated from the exact pinned LRPS2 binary.\n")
              f.write("# CoinOPS override: pcsx2_renderer defaults to Vulkan on Linux.\n")
              f.write("# pcsx2_bios is intentionally omitted because LRPS2 fills it\n")
              f.write("# dynamically from system/pcsx2/bios at runtime.\n\n")
              for key, value in options:
                  f.write(f'{key} = "{value}"\n')

          print(f"Generated LRPS2 options: {len(options)}")
          PY

          sed -n '1,40p' lrps2-core-options.cfg

      - name: Package LRPS2
        run: |
          set -euo pipefail

          CORE_ROOT="CoinOPS-Emulators-x86_64/emulators/libretro/cores/lrps2"

          mkdir -p \
            "$CORE_ROOT/system/pcsx2/bios" \
            "$CORE_ROOT/system/pcsx2/cheats" \
            "$CORE_ROOT/system/pcsx2/cheats_ws" \
            "$CORE_ROOT/system/pcsx2/memcards" \
            "$CORE_ROOT/system/pcsx2/textures" \
            "$CORE_ROOT/saves" \
            "$CORE_ROOT/states" \
            "$CORE_ROOT/remaps"

          cp \
            LRPS2Core/build-libretro/bin/pcsx2_libretro.so \
            "$CORE_ROOT/pcsx2_libretro.so"

          cp \
            CoinOPSRepo/Packaging/Emulators/libretro/cores/lrps2/core.cfg \
            "$CORE_ROOT/core.cfg"

          cp lrps2-core-options.cfg "$CORE_ROOT/core-options.cfg"
          cp LRPS2Core/COPYING.GPLv3 "$CORE_ROOT/LICENSE.txt"

          touch \
            "$CORE_ROOT/system/pcsx2/cheats/.keep" \
            "$CORE_ROOT/system/pcsx2/cheats_ws/.keep" \
            "$CORE_ROOT/system/pcsx2/memcards/.keep" \
            "$CORE_ROOT/system/pcsx2/textures/.keep" \
            "$CORE_ROOT/saves/.keep" \
            "$CORE_ROOT/states/.keep" \
            "$CORE_ROOT/remaps/.keep"

          cat > "$CORE_ROOT/system/pcsx2/bios/README-BIOS.txt" <<'EOF_BIOS'
          LRPS2 PlayStation 2 BIOS directory

          Place legally dumped PlayStation 2 BIOS files in this directory.
          LRPS2 scans this directory during core initialization and exposes valid
          4-8 MiB BIOS images through its dynamic pcsx2_bios core option.

          BIOS files are not distributed with CoinOPS.
          EOF_BIOS

          CORE_SHA256="$(sha256sum "$CORE_ROOT/pcsx2_libretro.so" | awk '{print $1}')"

          cat > "$CORE_ROOT/manifest.json" <<EOF_MANIFEST
          {
            "name": "LRPS2",
            "package_name": "lrps2",
            "type": "libretro-core",
            "platform": "linux-x86_64",
            "source_repository": "libretro/ps2",
            "source_commit": "43129ad5ccbde21b022dd3b3fad1862f72a109bf",
            "upstream_base": "PCSX2",
            "runtime_abi": "org.freedesktop.Platform/25.08",
            "core_path": "cores/lrps2/pcsx2_libretro.so",
            "core_config": "cores/lrps2/core.cfg",
            "core_options": "cores/lrps2/core-options.cfg",
            "sha256": "$CORE_SHA256"
          }
          EOF_MANIFEST

      - name: Validate packaged LRPS2 contract
        run: |
          set -euo pipefail

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              bash "$GITHUB_WORKSPACE/CoinOPSRepo/Packaging/Emulators/tools/validate-libretro-core.sh" \
                "$GITHUB_WORKSPACE/CoinOPS-Emulators-x86_64/emulators/libretro/cores/lrps2"
            '

      # ============================================================
      # PPSSPP - PlayStation Portable libretro core
      # ============================================================

      - name: Checkout PPSSPP source
        uses: actions/checkout@v6
        with:
          repository: hrydgard/ppsspp
          ref: c119d9b258289a4602691a6f97a8dc4091a94221
          path: PPSSPPCore
          clean: true
          fetch-depth: 1
          submodules: recursive

      - name: Show PPSSPP revision
        run: |
          echo "============================================================"
          echo "PPSSPP source"
          echo "============================================================"
          git -C PPSSPPCore rev-parse HEAD
          git -C PPSSPPCore describe --tags --always || true

      - name: Build PPSSPP libretro core
        run: |
          set -euo pipefail

          rm -rf PPSSPPCore/build-libretro

          flatpak run \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --command=sh \
            org.freedesktop.Sdk//25.08 \
            -c '
              set -eu
              cd "$GITHUB_WORKSPACE/PPSSPPCore"

              cmake \
                -S . \
                -B build-libretro \
                -DCMAKE_BUILD_TYPE=Release \
