# CoinOPS SwanStation per-core RetroArch overrides.
#
# No active frontend overrides are required. SwanStation renderer,
# BIOS selection, enhancements, controller behaviour and other emulator
# settings are exposed through the core options generated from the exact
# pinned core binary.
#
# These paths are owned by the CoinOPS libretro launcher and must NOT be
# overridden here:
#   system_directory
#   savefile_directory
#   savestate_directory
#   core_options_path
#   input_remapping_directory
