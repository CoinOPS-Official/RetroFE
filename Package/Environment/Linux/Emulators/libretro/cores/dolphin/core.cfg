# CoinOPS Dolphin per-core RetroArch configuration
#
# Dolphin's hardware renderer follows the RetroArch video driver. Vulkan is
# the preferred backend for the Steam Deck and current Linux GPU drivers.
video_driver = "vulkan"

# Runtime paths are owned by /app/bin/coinops-libretro and must not be set here:
#   system_directory
#   savefile_directory
#   savestate_directory
#   core_options_path
#   input_remapping_directory
#
# Dolphin behavior, controller type and Wii pointer mappings are controlled by
# core-options.cfg generated from the exact pinned Dolphin binary.
