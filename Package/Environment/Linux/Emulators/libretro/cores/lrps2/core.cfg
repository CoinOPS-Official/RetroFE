# CoinOPS LRPS2 RetroArch overrides
#
# This file contains frontend settings specific to LRPS2 only.
# The following keys are launcher-managed and must NOT be set here:
#   system_directory
#   savefile_directory
#   savestate_directory
#   core_options_path
#   input_remapping_directory
#
# LRPS2's renderer remains "Auto" in core-options.cfg so it can negotiate the
# best hardware context exposed by the CoinOPS RetroArch runtime. Add tested
# frontend-only overrides here later if a real compatibility need appears.
